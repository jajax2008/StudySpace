    }).catch(function(){});
  },0);
  var key=dvTier(S.ai.dev);
  var g=DEV.gpu,ok=dvGpuOk(g),eng=dvEngine(key);
  if(g&&!ok&&eng==='webgpu'){key='tiny';eng='wasm';S.ai.dev='tiny';save()}
  var t=DV_TIER[key],m=DEVMODELS[key]||{mb:t.mb};
  if(DEV.state==='ready')return '<div class="card" style="margin-bottom:12px"><b>On-device model ready</b><br><small>'+esc(DEV.id)+'. '+(eng==='wasm'?'Runs on your CPU, so no GPU is needed.':'Runs on your GPU with '+((g&&g.ws)||DV_MIN)+' shared memory.')+' No internet needed. Free and unlimited.</small><div style="display:flex;gap:8px;margin-top:10px"><button class="ghost" id="devunload" style="flex:1">Unload</button><button class="ghost" id="'+(eng==='wasm'?'dvdel':'devdelete')+'" style="flex:1">Delete download</button></div></div>';
  if(DEV.state==='loading')return '<div class="card" style="margin-bottom:12px"><b>'+(S.ai.devCached===key?'Loading model...':'Downloading model...')+'</b><div class="bar"><i id="devbar" style="width:'+DEV.pct+'%"></i></div><small id="devmsg">'+esc(DEV.msg)+'</small></div>';
  var opts=Object.keys(DV_TIER).map(function(k){
    var locked=DV_TIER[k].engine==='webgpu'&&g&&!ok;
    return '<option value="'+k+'"'+(key===k?' selected':'')+(locked?' disabled':'')+'>'+DV_TIER[k].label+' \u2014 '+DV_TIER[k].mb+(locked?' (locked on this phone)':'')+'</option>';
  }).join('');
  var cap;
  if(!g)cap='Checking this phone\u2019s GPU...';
  else if(ok)cap='GPU check passed: '+g.ws+' shared memory'+(g.f16?' with fast 16-bit shaders':' (32-bit mode)')+'. Small and Medium run here.';
  else cap='This phone reports '+(g.webgpu?(g.ws||'under 32768')+' of GPU shared memory':'no WebGPU')+', which is below '+(DV_MIN/1024)+'K. Small and Medium are locked here; Tiny runs on the CPU and works anyway.';
  return '<div class="card" style="margin-bottom:12px"><label>Model size<select id="devsize">'+opts+'</select></label>'+
  (DEV.state==='error'?'<p class="late" style="margin:8px 0 0">'+esc(DEV.msg)+'</p>':'')+
  '<p style="margin:8px 0 0">'+esc(cap)+'</p>'+
  '<div style="display:flex;gap:8px;margin-top:10px"><button id="devload" style="flex:1">'+(S.ai.devCached===key?'Load model':'Download model')+'</button><button class="ghost" id="devcheck" style="flex:1">Check my phone</button></div>'+
  '<small>The first download needs wifi ('+m.mb+', and it resumes if it stops). After that it works offline, even in airplane mode.'+(eng==='wasm'?' Tiny uses a 2048-token context and needs no GPU.':'')+'</small>'+(DEV.check?'<p style="margin:8px 0 0">'+esc(DEV.check)+'</p>':'')+'</div>';
};
document.addEventListener('click',async function(e){
  var b=e.target&&e.target.closest?e.target.closest('#dvdel'):null;
  if(!b)return;
  if(!sure(b,'Tap again to delete'))return;
  try{if(ENG&&ENG.unload)await ENG.unload()}catch(x){}
  ENG=null;
  try{
    var ks=await caches.keys();
    for(var i=0;i<ks.length;i++){if(/transformers|huggingface|onnx/i.test(ks[i]))await caches.delete(ks[i])}
  }catch(x){}
  DEV.state='idle';DEV.pct=0;DEV.msg='';S.ai.devCached='';save();render();
});
}catch(err){try{console.error('on-device tier layer failed',err)}catch(x){}}})();
</script>
<script>
/* ================= Group Study voice room (audio only, max 5) =================
   The worker keeps the participant list in Cloudflare KV; the audio itself is a
   peer-to-peer mesh over PeerJS, so nothing but the room code leaves the phones. */
(function(){
  'use strict';
  var PEER_SRC='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
  var G={peer:null,id:'',room:'',host:false,stream:null,muted:false,people:{},order:[],calls:{},ctx:null,an:{},raf:0,name:'',spk:true,started:0,timer:0};

  function q(id){return document.getElementById(id)}
  function initials(n){n=String(n||'?').trim();var p=n.split(/\s+/);return(((p[0]||'?')[0]||'?')+(p[1]?p[1][0]:'')).toUpperCase()}
  function nameFromInput(){
    var el=q('gsname'),v=el&&el.value?String(el.value).trim():'';
    if(!v)v=((typeof S!=='undefined'&&S.prof&&S.prof.name)||'').trim();
    return (v||'Learner').slice(0,24);
  }
  function post(path,body){
    return aiFetch(AI_WORKER_URL+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){
        return r.text().then(function(t){
          var j={};try{j=JSON.parse(t)}catch(e){}
          return {ok:r.ok,status:r.status,data:j||{}};
        });
      })
      .catch(function(){return {ok:false,status:0,data:{}}});
  }
  function errText(r){
    if(!r)return 'Could not reach the StudySpace server.';
    var d=r.data||{},m=(d.error&&(d.error.message||d.error))||d.message||'';
    if(m)return String(m);
    if(!r.status)return 'Could not reach the StudySpace server. Check your connection.';
    if(r.status===404)return 'Room not found. Check the code.';
    if(r.status===403)return 'Room is full (max 5 people)';
    return 'The room server did not answer ('+r.status+').';
  }
  function loadPeer(){
    if(window.Peer)return Promise.resolve(true);
    return new Promise(function(done){
      var s=document.createElement('script');
      s.src=PEER_SRC;s.async=true;
      s.onload=function(){done(!!window.Peer)};
      s.onerror=function(){done(false)};
      document.head.appendChild(s);
    });
  }
  function mic(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return Promise.reject(new Error('no-media'));
    return navigator.mediaDevices.getUserMedia({audio:true,video:false});
  }

  /* ---- overlay ---- */
  function shell(){
    var r=q('gsroom');
    if(!r){
      r=document.createElement('div');r.id='gsroom';
      r.setAttribute('role','dialog');r.setAttribute('aria-label','Group Study voice room');
      document.body.appendChild(r);
    }
    return r;
  }
  function closeOverlay(){var r=q('gsroom');if(r)r.remove()}
  function status(msg,bad){
    var el=q('gsstatus');
    if(!el)return;
    el.className='gsnote'+(bad?' gserr':'');
    el.textContent=msg;
  }
  function lobby(){
    var r=shell();
    r.innerHTML='<div class="gsl">'+
      '<div class="gsl-hero"><div class="gsl-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>'+
      '<h1>Group Study</h1><p>A voice-only study lounge for up to five people. No cameras, no feeds \u2014 just focus, together.</p>'+
      '<button type="button" class="gsl-x" data-gs="close">Close</button></div>'+
      '<div class="gsl-glass"><h2>Start a lounge</h2><p>Open a room and share the code with your study group.</p>'+
      '<label class="gslabel" for="gsname">Your name</label><input id="gsname" maxlength="24" autocomplete="off" value="'+esc(G.name||((S.prof&&S.prof.name)||'').trim())+'">'+
      '<div style="margin-top:10px"><button type="button" class="gsl-btn" data-gs="create">Create room</button></div></div>'+
      '<div class="gsl-glass"><h2>Join a lounge</h2><p>Enter the six-character code your host shared.</p>'+
      '<input id="gscode" class="gsl-code" maxlength="6" placeholder="STUDY7" autocapitalize="characters" autocomplete="off" spellcheck="false">'+
      '<button type="button" class="gsl-btn ghost" data-gs="join">Join room</button></div>'+
      '<p class="gsnote" id="gsstatus" style="text-align:center">Audio only. Nobody can see your camera.</p></div>';
  }
  function seatHTML(id){
    var p=G.people[id]||{},me=id===G.id,muted=!!p.muted||(me&&G.muted);
    return '<div class="gsp" data-gsp="'+esc(id)+'"><span class="ring" aria-hidden="true"></span>'+
      '<div class="av">'+esc(initials(p.name))+'</div>'+
      '<b>'+esc(p.name||'Guest')+(me?' (you)':'')+'</b>'+
      '<span class="tag'+(muted?' mut':'')+'" data-gsl>'+(muted?'Muted':(p.live?'Listening':'Connecting\u2026'))+'</span></div>';
  }
  function paintPeople(){
    var out=G.order.map(seatHTML).join(''),i;
    for(i=G.order.length;i<5;i++)out+='<div class="gsp empty"><div class="av">+</div><b>Open seat</b><small>Waiting</small></div>';
    var el=q('gspeople');if(el)el.innerHTML=out;
    var c=q('gscount');if(c)c.textContent=G.order.length+'/5';
  }
  function paintTimer(){
    var el=q('gstime');if(!el)return;
    if(!G.started){el.textContent='00:00';return}
    var s=Math.max(0,Math.floor((Date.now()-G.started)/1000));
    var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;
    el.textContent=(h?h+':':'')+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0');
  }
  function stopTimer(){if(G.timer){clearInterval(G.timer)}G.timer=0;G.started=0}
  function startTimer(){stopTimer();G.started=Date.now();paintTimer();G.timer=setInterval(paintTimer,1000)}
  function room(){
    var r=shell();
    r.innerHTML='<div class="gsl">'+
      '<div class="gsl-bar"><span class="gsl-live"><i></i>Live study room</span><span class="gsl-time" id="gstime">00:00</span>'+
        '<button type="button" class="gsl-copy" data-gs="copy" aria-label="Copy room code"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg>'+esc(G.room)+'</button>'+
        '<button type="button" class="gsl-x" data-gs="close" style="position:static">Close</button></div>'+
      '<div class="gsl-seats" id="gspeople"></div>'+
      '<p class="gsnote" style="text-align:center;margin:0">A glowing ring shows who is speaking. Audio only, max five people.</p>'+
      '<div class="gsl-dock">'+
        '<button type="button" data-gs="mute" id="gsmute">'+(G.muted?'Unmute':'Mute')+'</button>'+
        '<button type="button" data-gs="speaker" id="gsspk"'+(G.spk?'':' class="off"')+'>'+(G.spk?'Speaker':'Speaker off')+'</button>'+
        '<button type="button" class="gsl-leave" data-gs="leave" aria-label="Leave room"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 8l-4 4 4 4M6 12h9"/></svg></button></div>'+
      '<div id="gsaudio"></div></div>';
    paintPeople();paintTimer();
  }

  /* ---- people ---- */
  function addPerson(id,name,live){
    if(!id)return;
    if(!G.people[id]){G.people[id]={name:name||'Guest',live:!!live};G.order.push(id)}
    else{G.people[id].live=!!live;if(name)G.people[id].name=name}
    paintPeople();
  }
  function dropPerson(id){
    if(!G.people[id])return;
    delete G.people[id];
    G.order=G.order.filter(function(x){return x!==id});
    delete G.calls[id];
    stopListen(id);
    var a=q('gsa-'+id);if(a)a.remove();
    paintPeople();
  }
  function attach(id,stream,name){
    addPerson(id,name,true);
    var box=q('gsaudio');
    if(box){
      var a=q('gsa-'+id);
      if(!a){a=document.createElement('audio');a.id='gsa-'+id;a.autoplay=true;a.setAttribute('playsinline','');box.appendChild(a)}
      try{a.srcObject=stream}catch(e){a.src=URL.createObjectURL(stream)}
      a.muted=!G.spk;
      var p=a.play();if(p&&p.catch)p.catch(function(){});
    }
    listen(id,stream);
  }

  /* ---- speaking rings (Web Audio analyser per stream) ---- */
  function listen(id,stream){
    try{
      var C=window.AudioContext||window.webkitAudioContext;
      if(!C)return;
      G.ctx=G.ctx||new C();
      if(G.ctx.state==='suspended'){var r=G.ctx.resume();if(r&&r.catch)r.catch(function(){})}
      var src=G.ctx.createMediaStreamSource(stream),an=G.ctx.createAnalyser();
      an.fftSize=512;an.smoothingTimeConstant=.75;src.connect(an);
      G.an[id]={an:an,src:src,buf:new Uint8Array(an.fftSize)};
      loop();
    }catch(e){}
  }
  function stopListen(id){
    var a=G.an[id];
    if(a&&a.src){try{a.src.disconnect()}catch(e){}}
    delete G.an[id];
  }
  function loop(){
    if(G.raf)return;
    var step=function(){
      var ids=Object.keys(G.an);
      if(!ids.length){G.raf=0;return}
      ids.forEach(function(id){
        var a=G.an[id];if(!a)return;
        var sum=0,i=0;
        a.an.getByteTimeDomainData(a.buf);
        for(;i<a.buf.length;i++){var v=(a.buf[i]-128)/128;sum+=v*v}
        var lvl=Math.sqrt(sum/a.buf.length);
        var on=lvl>.035;
        var card=document.querySelector('[data-gsp="'+id+'"]');
        if(!card)return;
        card.classList.toggle('speaking',on);
        try{card.style.setProperty('--lvl',Math.min(1,Math.max(0,(lvl-.008)*7)).toFixed(2))}catch(e){}
        var muted=(id===G.id&&G.muted);
        var l=card.querySelector('[data-gsl]');
        if(l){l.textContent=muted?'Muted':(on?'Speaking':(id===G.id?'You are live':'Listening'));l.classList.toggle('mut',muted)}
      });
      G.raf=requestAnimationFrame(step);
    };
    G.raf=requestAnimationFrame(step);
  }

  /* ---- calls ---- */
  function callPeer(id,name){
    if(!G.peer||!G.stream||!id||id===G.id||G.calls[id])return;
    var call=null;
    try{call=G.peer.call(id,G.stream,{metadata:{name:G.name}})}catch(e){return}
    if(!call)return;
    G.calls[id]=call;
    call.on('stream',function(s){attach(id,s,name)});
    call.on('close',function(){dropPerson(id)});
    call.on('error',function(){dropPerson(id)});
  }
  function incoming(call){
    if(!call||!call.peer)return;
    if(G.calls[call.peer]){try{call.close()}catch(e){}return}
    var name=(call.metadata&&call.metadata.name)||'Guest';
    G.calls[call.peer]=call;
    try{call.answer(G.stream)}catch(e){}
    call.on('stream',function(s){attach(call.peer,s,name)});
    call.on('close',function(){dropPerson(call.peer)});
    call.on('error',function(){dropPerson(call.peer)});
    addPerson(call.peer,name,false);
  }
  function peerErr(err){
    var t=err&&err.type;
    if(t==='peer-unavailable'){
      var m=/peer\s+([A-Za-z0-9]+)/.exec((err&&err.message)||'');
      if(m&&G.people[m[1]])dropPerson(m[1]);
      banner('A study partner could not be reached.');
      return;
    }
    if(t==='network'||t==='server-error'||t==='socket-error'||t==='socket-closed'){
      leave('Lost the connection to the voice server.');
      return;
    }
    if(t==='unavailable-id'){leave('Could not start the voice connection. Try again.')}
  }

  /* ---- lifecycle ---- */
  function enter(code,people){
    G.room=code;
    room();
    startTimer();
    addPerson(G.id,G.name,true);
    listen(G.id,G.stream);
    (people||[]).forEach(function(p){
      if(!p||!p.peerId||p.peerId===G.id)return;
      addPerson(p.peerId,p.name,false);
      callPeer(p.peerId,p.name);
    });
  }
  function cleanup(){
    stopTimer();
    if(G.raf){try{cancelAnimationFrame(G.raf)}catch(e){}}
    G.raf=0;
    Object.keys(G.an).forEach(stopListen);
    if(G.ctx&&G.ctx.close){try{G.ctx.close()}catch(e){}}
    G.ctx=null;
    Object.keys(G.calls).forEach(function(k){try{G.calls[k].close()}catch(e){}});
    G.calls={};
    if(G.stream){try{G.stream.getTracks().forEach(function(t){t.stop()})}catch(e){}}
    G.stream=null;
    if(G.peer){try{G.peer.destroy()}catch(e){}}
    G.peer=null;
  }
  function leave(msg){
    var code=G.room,id=G.id;
    cleanup();
    G.room='';G.id='';G.host=false;G.muted=false;G.people={};G.order=[];G.name='';
    closeOverlay();
    if(code&&id)post('/room/leave',{roomCode:code,peerId:id});
    if(msg)banner(msg);
  }
  function create(){
    G.name=nameFromInput();
    status('Starting your microphone\u2026');
    loadPeer().then(function(ok){
      if(!ok){status('Could not load the voice library. Check your internet connection.',1);return}
      return mic().then(function(stream){
        G.stream=stream;
        status('Creating the room\u2026');
        var peer=new Peer();
        G.peer=peer;
        peer.on('error',peerErr);
        peer.on('call',incoming);
        peer.on('disconnected',function(){try{peer.reconnect()}catch(e){}});
        peer.on('open',function(id){
          G.id=id;
          post('/room/create',{peerId:id,userName:G.name}).then(function(r){
            if(!r.ok||!r.data||!r.data.roomCode){
              status(errText(r),1);
              cleanup();
              G.id='';
              return;
            }
            G.host=true;
            enter(r.data.roomCode,[{peerId:id,name:G.name}]);
          });
        });
      },function(e){
        status(e&&e.name==='NotAllowedError'?'Allow microphone access to join a voice room.':'No microphone was found on this device.',1);
      });
    });
  }
  function join(){
    var name=nameFromInput();
    var codeEl=q('gscode');
    var code=String((codeEl&&codeEl.value)||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
    G.name=name;
    if(code.length!==6){status('Enter the 6-character room code.',1);return}
    status('Joining the room\u2026');
    loadPeer().then(function(ok){
      if(!ok){status('Could not load the voice library. Check your internet connection.',1);return}
      return mic().then(function(stream){
        G.stream=stream;
        var peer=new Peer();
        G.peer=peer;
        peer.on('error',peerErr);
        peer.on('call',incoming);
        peer.on('disconnected',function(){try{peer.reconnect()}catch(e){}});
        peer.on('open',function(id){
          G.id=id;
          post('/room/join',{roomCode:code,peerId:id,userName:G.name}).then(function(r){
            if(!r.ok||!r.data||!Array.isArray(r.data.participants)){
              status(errText(r),1);
              cleanup();
              G.id='';
              return;
            }
            enter(code,r.data.participants);
          });
        });
      },function(e){
        status(e&&e.name==='NotAllowedError'?'Allow microphone access to join a voice room.':'No microphone was found on this device.',1);
      });
    });
  }
  function copyCode(){
    var code=G.room;
    if(!code)return;
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(code).then(function(){banner('Room code '+code+' copied.')},function(){banner('Room code: '+code)});
    }else banner('Room code: '+code);
  }
  function toggleMute(){
    G.muted=!G.muted;
    if(G.stream){try{G.stream.getAudioTracks().forEach(function(t){t.enabled=!G.muted})}catch(e){}}
    var b=q('gsmute');if(b){b.textContent=G.muted?'Unmute':'Mute';b.classList.toggle('off',G.muted)}
    var tag=document.querySelector('[data-gsp="'+G.id+'"] [data-gsl]');
    if(tag){tag.textContent=G.muted?'Muted':'Listening';tag.classList.toggle('mut',G.muted)}
  }
  function toggleSpeaker(){
    G.spk=!G.spk;
    [].forEach.call(document.querySelectorAll('#gsaudio audio'),function(a){a.muted=!G.spk});
    var b=q('gsspk');if(b){b.textContent=G.spk?'Speaker':'Speaker off';b.classList.toggle('off',!G.spk)}
  }

  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-gs]');
    if(!b)return;
    var a=b.getAttribute('data-gs');
    if(a==='open')return; /* handled by the main app handler */
    if(a==='close'){if(G.room)leave();else closeOverlay();return}
    if(a==='create'){create();return}
    if(a==='join'){join();return}
    if(a==='copy'){copyCode();return}
    if(a==='mute'){toggleMute();return}
    if(a==='speaker'){toggleSpeaker();return}
    if(a==='leave'){leave('You left the study room.');return}
  });
  document.addEventListener('keydown',function(e){
    if(e.key!=='Enter')return;
    if(e.target&&e.target.id==='gscode'){e.preventDefault();join()}
    else if(e.target&&e.target.id==='gsname'){e.preventDefault()}
  });
  window.addEventListener('pagehide',function(){
    if(!G.room)return;
    if(G.id&&navigator.sendBeacon){
      try{
        navigator.sendBeacon(AI_WORKER_URL+'/room/leave',new Blob([JSON.stringify({roomCode:G.room,peerId:G.id})],{type:'application/json'}));
      }catch(e){}
    }
    cleanup();
  });

  window.groupStudyOpen=function(){
    if(G.room){room();return}
    lobby();
  };
})();
</script>
</body>
