<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudySpace</title>
<meta name="theme-color" content="#f3f3f3">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f1f5ef;--ink:#1e2b24;--muted:#5d6e64;--accent:#3d7a5a;--card:#fff;--line:#d9e3da;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111915;--ink:#e5eee8;--muted:#92a69a;--accent:#7cc29e;--card:#1a251f;--line:#29372e;--on:#0f1a14;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111915;--ink:#e5eee8;--muted:#92a69a;--accent:#7cc29e;--card:#1a251f;--line:#29372e;--on:#0f1a14;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:20px 18px 24px}
h1{font-size:28px;font-weight:800;margin:0 0 2px;letter-spacing:-.5px}
h2{font-size:18px;font-weight:600;margin:26px 0 10px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stats{display:flex;gap:10px}
.stats .card{flex:1;padding:12px}
.stats b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.stats span{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}
.row .t div{overflow-wrap:anywhere}
small{color:var(--muted)}
.row.done .t div{text-decoration:line-through;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.late{color:#c2410c;font-weight:600}
label{display:block;font-size:13px;color:var(--muted)}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
label input,label select{margin-top:4px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.form{display:grid;gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:var(--on);font-weight:600}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.x{background:none;color:var(--muted);padding:4px 8px;font-size:20px;line-height:1}
.subcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);margin-bottom:8px;padding:14px;font-weight:400}
.subcard .t{flex:1;min-width:0}
.modes{display:flex;gap:8px;margin-bottom:14px}
.modes button{flex:1;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.modes button.on{background:var(--accent);color:var(--on);border-color:var(--accent)}
.ring{display:block;margin:6px auto 4px;width:min(78vw,300px);height:auto}
.ring text{fill:var(--ink);font-family:inherit}
.ctrl{display:flex;gap:10px;justify-content:center;margin:14px 0}
.ctrl button{min-width:96px}
.empty{color:var(--muted);padding:8px 0}
.banner{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));max-width:496px;margin:0 auto;background:var(--accent);color:var(--on);padding:14px;border-radius:12px;z-index:9;font-weight:600}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--muted);border-radius:0;padding:12px 4px;font-size:13px}
nav button.on{color:var(--accent);box-shadow:inset 0 2px 0 var(--accent)}
textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;min-height:48vh;resize:vertical}
textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.row.past{opacity:.55}
.row b{white-space:nowrap;font-variant-numeric:tabular-nums;font-size:14px}
.rmain{flex:1;min-width:0;text-align:left;background:none;color:var(--ink);padding:0;font-weight:400}
button:disabled{opacity:.5;cursor:default}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px;font-weight:400;min-height:78px}
.tile b{font-size:16px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.over i{background:#c2410c}
.choice-btn{width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);padding:12px 14px;border-radius:10px;font-weight:500;margin-bottom:8px}
.choice-btn.correct{background:#16a34a;color:#fff;border-color:#16a34a}
.choice-btn.wrong{background:#dc2626;color:#fff;border-color:#dc2626}
</style>
</head>
<body>
<div id="app"><main id="view"></main>
<nav><button data-t="home">Home</button><button data-t="acad">Academics</button><button data-t="focus">Focus</button><button data-t="more">More</button></nav></div>
<script>
const COLORS=['#3d7a5a','#c0793b','#5b7fb5','#a45a7c','#8a8f3a'];
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const AI_WORKER_URL='https://studyspace-ai.jasper-esclamado02.workers.dev';
const MAX_AI_MB=10;
const MAX_AI_BYTES=MAX_AI_MB*1024*1024;
const MAX_AI_DAILY=2;

const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayStr=()=>ymd(new Date());

const blank=()=>({subjects:[],tasks:[],sessions:[],exams:[],notes:[],decks:[],res:[],reviews:[],grades:{},wallet:{tx:[],budget:0,goals:[]},journal:{},habits:[],sleep:{bed:'22:30',wake:'06:00'},theme:'',alerts:false,lead:10,fired:{},ai:{date:todayStr(),used:0}});
function load(){
  let d=blank();
  try{d=Object.assign(d,JSON.parse(localStorage.getItem('studyspace1')))}catch(e){}
  d.subjects.forEach(s=>{s.classes=s.classes||[]});
  d.tasks.forEach(t=>{t.time=t.time||'23:59'});
  if(!d.ai)d.ai={date:todayStr(),used:0};
  delete d.ai.key; // Remove any previously stored local key
  if(d.ai.date!==todayStr()){d.ai.date=todayStr();d.ai.used=0;}
  return d;
}
let S=load();
function save(){try{localStorage.setItem('studyspace1',JSON.stringify(S))}catch(e){}}
function aiLeft(){
  if(S.ai.date!==todayStr()){S.ai.date=todayStr();S.ai.used=0;save();}
  return Math.max(0,MAX_AI_DAILY-S.ai.used);
}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmtT=t=>{const[h,m]=t.split(':').map(Number);return((h+11)%12+1)+':'+String(m).padStart(2,'0')+' '+(h<12?'AM':'PM')};
function applyTheme(){if(S.theme)document.documentElement.setAttribute('data-theme',S.theme);else document.documentElement.removeAttribute('data-theme')}
applyTheme();
let tab='home',curSub=null;
const T={mode:'p',f:25,b:5,phase:'focus',left:1500,running:false,end:0};
const PRESETS={p:[25,5],d:[52,17]};
const subj=id=>S.subjects.find(s=>s.id===id);
const at=t=>new Date(t.due+'T'+(t.time||'23:59')).getTime();
function dueLabel(t){if(!t.due)return'';const tm=fmtT(t.time||'23:59');if(!t.done&&at(t)<Date.now())return'<span class="late">Overdue · '+t.due+', '+tm+'</span>';if(!t.done&&t.due===todayStr())return'<span class="late">Due today, '+tm+'</span>';return'Due '+t.due+', '+tm}
const byDue=(a,b)=>((a.due||'9999')+(a.time||'')).localeCompare((b.due||'9999')+(b.time||''));
const sortedOpen=()=>S.tasks.filter(t=>!t.done).sort(byDue);
function focusToday(){return S.sessions.filter(x=>x.date===todayStr()).reduce((a,x)=>a+x.min,0)}
function streak(){const days=new Set(S.sessions.map(x=>x.date));let d=new Date(),n=0;if(!days.has(ymd(d)))d.setDate(d.getDate()-1);while(days.has(ymd(d))){n++;d.setDate(d.getDate()-1)}return n}
function taskRow(t,hideSubj){const s=subj(t.subj);return'<div class="row'+(t.done?' done':'')+'"><input type="checkbox" style="width:22px;height:22px;flex:none" data-done="'+t.id+'"'+(t.done?' checked':'')+' aria-label="Mark done"><span class="dot" style="background:'+(s?s.color:'var(--line)')+'"></span><div class="t"><div>'+esc(t.title)+'</div><small>'+(s&&!hideSubj?esc(s.name)+' · ':'')+dueLabel(t)+'</small></div><button class="x" data-deltask="'+t.id+'" aria-label="Delete">×</button></div>'}
function todayClasses(){const d=new Date().getDay(),o=[];S.subjects.forEach(s=>s.classes.forEach(c=>{if(c.day===d)o.push({s,c})}));return o.sort((a,b)=>a.c.start.localeCompare(b.c.start))}
function home(){
if(hv==='exams')return examsView();
if(hv==='learn')return L?wizard():learnView();
if(hv==='lib')return libView();
if(hv==='grades')return gradesView();
if(hv==='wallet')return walletView();
if(hv==='journal')return journalView();
if(hv==='life')return lifeView();
if(hv==='buddy')return buddyView();
if(hv==='notes')return notesView();
if(hv&&hv.startsWith('n:'))return noteEditor(hv.slice(2));
return dash()}
function tile(id,t,sub){return'<button class="tile" data-mod="'+id+'"><b>'+t+'</b><small>'+sub+'</small></button>'}
function dash(){
const h=new Date().getHours(),g=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
const open=sortedOpen(),tc=todayClasses(),up=examsSorted().filter(x=>examDays(x)>=0).slice(0,3),due=S.reviews.filter(r=>r.next<=todayStr()).length;
const hd=S.habits.filter(x=>x.days[todayStr()]).length,je=S.journal[todayStr()];
return'<h1>'+g+'</h1><p class="sub">'+new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})+'</p>'+
'<div class="stats"><div class="card"><b>'+focusToday()+'</b><span>minutes focused</span></div><div class="card"><b>'+streak()+'</b><span>day streak</span></div><div class="card"><b>'+open.length+'</b><span>tasks open</span></div></div>'+
(S.alerts?'':'<div class="card" style="margin-top:12px">Get a beep for classes and deadlines. <button class="ghost" data-t="more" style="margin-top:8px">Set up alerts</button></div>')+
(due?'<button class="subcard" id="gorev" style="margin-top:12px"><span class="t"><b>Topics to review</b><br><small>'+due+' due in Spaced Repetition</small></span><span aria-hidden="true">›</span></button>':'')+
'<h2>Today\u2019s classes</h2><div class="card">'+(tc.length?tc.map(x=>'<div class="row"><span class="dot" style="background:'+x.s.color+'"></span><div class="t"><div>'+esc(x.s.name)+'</div><small>'+fmtT(x.c.start)+(x.c.end?' – '+fmtT(x.c.end):'')+(x.c.room?' · '+esc(x.c.room):'')+'</small></div></div>').join(''):'<div class="empty">No classes today.</div>')+'</div>'+
'<h2>Due soon</h2><div class="card">'+(open.length?open.slice(0,5).map(t=>taskRow(t)).join(''):'<div class="empty">Nothing due. Open a subject in Academics to add assignments.</div>')+'</div>'+
'<h2>Exam countdown</h2><div class="card">'+(up.length?up.map(x=>examRow(x,1)).join(''):'<div class="empty">No upcoming exams.</div>')+'<button class="ghost" data-mod="exams" style="margin-top:8px;width:100%">'+(S.exams.length?'Manage exams':'Add an exam')+'</button></div>'+
'<h2>Study tools</h2><div class="tiles">'+tile('notes','Notes',S.notes.length+' saved')+tile('learn','Learning Techniques',due?due+' to review':'Flashcards & AI')+tile('lib','Resource Library',S.res.length+' saved')+tile('buddy','StudyBuddy','Summaries and quizzes')+tile('grades','Grade Calculator','Scores and targets')+tile('exams','Exams',up.length+' upcoming')+'</div>'+
'<h2>Money and life</h2><div class="tiles">'+tile('wallet','Wallet',money(walletBal()))+tile('journal','Daily Journal',je&&je.text?'Written today':'Write today')+tile('life','Life Tracker',S.habits.length?hd+' of '+S.habits.length+' done today':'Build habits')+'</div>'+
'<h2>Ready to study?</h2><button data-go="focus" style="width:100%">Start a focus session</button>'}
function acad(){
const s=subj(curSub);if(s)return detail(s);
const list=S.subjects.map(x=>{const n=S.tasks.filter(t=>t.subj===x.id&&!t.done).length;return'<button class="subcard" data-open="'+x.id+'"><span class="dot" style="background:'+x.color+'"></span><span class="t"><b>'+esc(x.name)+'</b><br><small>'+x.classes.length+' classes · '+n+' open assignments</small></span><span aria-hidden="true">›</span></button>'}).join('');
return'<h1>Academics</h1><p class="sub">Tap a subject to add its classes and assignments</p><div style="display:flex;gap:8px;margin-bottom:16px"><input id="subname" placeholder="New subject, e.g. Mathematics" maxlength="40"><button id="addsub" style="white-space:nowrap">Add</button></div>'+(list||'<div class="empty">No subjects yet. Add your first one above.</div>')}
function detail(s){
const cl=s.classes.slice().sort((a,b)=>((a.day+6)%7-(b.day+6)%7)||a.start.localeCompare(b.start)).map(c=>'<div class="row"><div class="t"><div>'+DAYS[c.day]+' · '+fmtT(c.start)+(c.end?' – '+fmtT(c.end):'')+'</div>'+(c.room?'<small>'+esc(c.room)+'</small>':'')+'</div><button class="x" data-delclass="'+c.id+'" aria-label="Delete class">×</button></div>').join('');
const ts=S.tasks.filter(t=>t.subj===s.id).sort((a,b)=>(a.done-b.done)||byDue(a,b));
return'<button class="ghost" id="back">‹ Academics</button><h1 style="border-left:6px solid '+s.color+';padding-left:10px;margin-top:14px">'+esc(s.name)+'</h1>'+
'<h2>Class schedule</h2><div class="card">'+(cl||'<div class="empty">No class times yet.</div>')+'</div>'+
'<div class="form" style="margin-top:10px"><div class="two"><label>Day<select id="cday">'+[1,2,3,4,5,6,0].map(d=>'<option value="'+d+'">'+DAYS[d]+'</option>').join('')+'</select></label><label>Room (optional)<input id="croom" maxlength="30"></label></div><div class="two"><label>Starts<input id="cstart" type="time"></label><label>Ends<input id="cend" type="time"></label></div><button id="addclass">Add class time</button></div>'+
'<h2>Assignments</h2><div class="form"><input id="ttitle" placeholder="What is due?" maxlength="80"><div class="two"><label>Due date<input id="tdue" type="date"></label><label>Due time<input id="ttime" type="time" value="23:59"></label></div><button id="addtask">Add assignment</button></div>'+
'<div class="card" style="margin-top:12px">'+(ts.length?ts.map(t=>taskRow(t,true)).join(''):'<div class="empty">No assignments yet.</div>')+'</div>'+
'<button class="ghost" id="delsubj" style="margin-top:24px;width:100%">Delete this subject</button>'}
const C=2*Math.PI*90;
function mmss(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function total(){return(T.phase==='focus'?T.f:T.b)*60}
function ringHTML(){const off=C*(1-T.left/total());return'<svg class="ring" viewBox="0 0 220 220" role="img" aria-label="Timer"><circle cx="110" cy="110" r="90" fill="none" stroke="var(--line)" stroke-width="12"/><circle id="arc" cx="110" cy="110" r="90" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'" transform="rotate(-90 110 110)"/><text id="clock" x="110" y="118" text-anchor="middle" font-size="46" font-weight="800">'+mmss(T.left)+'</text><text x="110" y="146" text-anchor="middle" font-size="14" style="fill:var(--muted)">'+(T.phase==='focus'?'Focus':'Break')+'</text></svg>'}
function focus(){
return'<h1>Focus Room</h1><p class="sub">Pick a method and start.</p>'+
'<div class="modes"><button data-mode="p" class="'+(T.mode==='p'?'on':'')+'">Pomodoro<br><small>25 / 5</small></button><button data-mode="d" class="'+(T.mode==='d'?'on':'')+'">52 / 17</button><button data-mode="c" class="'+(T.mode==='c'?'on':'')+'">Custom</button></div>'+
(T.mode==='c'?'<div class="two" style="margin-bottom:8px"><label>Focus minutes<input id="cf" type="number" min="1" max="180" value="'+T.f+'"></label><label>Break minutes<input id="cb" type="number" min="1" max="60" value="'+T.b+'"></label></div>':'')+
ringHTML()+
'<div class="ctrl"><button id="tgo">'+(T.running?'Pause':'Start')+'</button><button class="ghost" id="treset">Reset</button><button class="ghost" id="tskip">Skip</button></div>'+
'<div class="card"><b>'+focusToday()+' minutes</b> focused today across '+S.sessions.filter(x=>x.date===todayStr()).length+' sessions.</div>'}
function more(){return moreMain()}
function moreMain(){
return'<h1>More</h1><p class="sub">Alerts, AI quota, and settings</p>'+
'<h2 style="margin-top:0">Alerts</h2><div class="card"><div class="row"><div class="t">Beep for classes and deadlines</div><button id="alerton" class="'+(S.alerts?'ghost':'')+'">'+(S.alerts?'Turn off':'Turn on')+'</button></div>'+
'<div class="row"><div class="t">Remind me</div><select id="lead" style="width:auto"><option value="0">At the time</option><option value="10">10 min before</option><option value="30">30 min before</option><option value="60">1 hour before</option></select></div>'+
'<div class="row"><div class="t"><small>Alerts sound while StudySpace is open or running in the background.</small></div><button class="ghost" id="testalert">Test</button></div></div>'+
'<h2>AI Flashcards Quota</h2><div class="card"><div class="row"><div class="t">Daily AI uses remaining<br><small>Resets every midnight (Max 2/day, 10MB max file)</small></div><b>'+aiLeft()+' / '+MAX_AI_DAILY+'</b></div></div>'+
'<h2>Settings</h2><div class="card"><div class="row"><div class="t">Appearance</div><select id="theme" style="width:auto"><option value="">Match phone</option><option value="light">Light</option><option value="dark">Dark</option></select></div>'+
'<div class="row"><div class="t">Your data<br><small>Saved only in this browser on this device.</small></div><button class="ghost" id="reset">Clear all</button></div></div>'}
function render(){
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
$('#view').innerHTML={home,acad,focus,more}[tab]();
if(tab==='more'&&$('#theme')){$('#theme').value=S.theme;$('#lead').value=String(S.lead)}
}
/* learning techniques */
const TECH={
recall:{n:'Active Recall',d:'Study, hide it, recall, check',s:[['topic','text','What topic are you studying?'],['','info','Study {topic} for a few minutes. Read your notes or textbook, then tap Next.'],['recalled','long','Close your notes. Write everything you can remember about {topic}.'],['missed','long','Open your notes and compare. What did you forget or get wrong?']]},
feynman:{n:'Feynman Technique',d:'Explain it simply and find your gaps',s:[['topic','text','Which topic do you want to understand?'],['explain','long','Explain {topic} in your own words, as if teaching a friend.'],['gaps','long','Which parts could you not explain, or got stuck on?'],['','info','Go back to your notes or textbook and study only those gaps. Tap Next when you have reviewed them.'],['simple','long','Now explain {topic} again, simpler, with an example.']]},
blurt:{n:'Blurting',d:'Write everything you remember, then compare',s:[['topic','text','What topic are you blurting?'],['','info','Read about {topic} for a few minutes, then tap Next.'],['blurt','long','Without looking, write everything you remember about {topic}.'],['added','long','Compare with your notes. Add everything you missed.']]},
test:{n:'Practice Testing',d:'Answer questions and review mistakes',s:[['topic','text','What topic are you testing yourself on?'],['questions','long','Write 3 to 5 questions about {topic}, one per line.'],['answers','long','Answer your questions from memory.'],['mistakes','long','Check your answers. Which ones were wrong, and what is the correct answer?']]}
};
let L=null,mv=null;
const fill=x=>x.replace('{topic}',(L&&L.data.topic)||'this topic');
function learnView(){
const due=S.reviews.filter(r=>r.next<=todayStr()).length;
return'<button class="ghost" id="mvback">‹ Home</button><h1 style="margin-top:14px">Learning Techniques</h1><p class="sub">Pick a method and it guides you step by step</p>'+
Object.entries(TECH).map(([k,t])=>'<button class="subcard" data-tech="'+k+'"><span class="t"><b>'+t.n+'</b><br><small>'+t.d+'</small></span><span aria-hidden="true">›</span></button>').join('')+
'<button class="subcard" data-tech="flash"><span class="t"><b>Flashcards (AI & Offline)</b><br><small>Summarize & generate multiple choice cards · '+aiLeft()+'/'+MAX_AI_DAILY+' AI left'+(S.decks.length?' · '+S.decks.length+' decks':'')+'</small></span><span aria-hidden="true">›</span></button>'+
'<button class="subcard" data-tech="spaced"><span class="t"><b>Spaced Repetition</b><br><small>Review at growing intervals'+(due?' · '+due+' due':'')+'</small></span><span aria-hidden="true">›</span></button>'}
function wizard(){
if(L.k==='spaced')return spacedView();
if(L.k==='flash')return flashView();
const t=TECH[L.k],n=t.s.length;

t.replace(/\s+/g,' ').split(/(?<=[.!?])\s+/).forEach(x=>{const m=x.match(/^([A-Z][\w\s'’()-]{2,50}?)\s+(is|are|refers to|means)\s+(.{15,})$/);if(m&&!seen.has(m[1].toLowerCase())){seen.add(m[1].toLowerCase());cards.push({q:'What '+(m[2]==='are'?'are ':'is ')+m[1]+'?',a:m[3]})}});
const f={};(t.toLowerCase().match(/[a-z]{4,}/g)||[]).forEach(w=>f[w]=(f[w]||0)+1);
summarize(t,14).filter(x=>x.length<=220).forEach(x=>{const ws=(x.match(/[A-Za-z]{6,}/g)||[]).sort((a,b)=>(f[b.toLowerCase()]||0)-(f[a.toLowerCase()]||0)||b.length-a.length);if(!ws.length)return;const w=ws[0],q='Fill in the blank: '+x.replace(new RegExp('\\b'+w+'\\b','i'),'_____');if(!seen.has(q)){seen.add(q);cards.push({q,a:w})}});
return cards.slice(0,30)}

async function readFlashSource(){
  F.src=$('#fsrc').value;F.text=$('#ftext').value;
  const fi=$('#ffile').files[0];
  let t='';
  if(fi){
    if(fi.size>MAX_AI_BYTES)throw new Error('size');
    t=await fileText(fi);F.name=fi.name.replace(/\.[^.]+$/,'');
  }else if(F.text.trim()){
    if(new Blob([F.text]).size>MAX_AI_BYTES)throw new Error('size');
    t=F.text;F.name='Pasted text';
  }else if(F.src.startsWith('n:')){
    const n=S.notes.find(x=>x.id===F.src.slice(2));
    t=n?n.body:'';F.name=n?noteTitle(n):'';
  }else if(F.src.startsWith('r:')){
    const r=S.res.find(x=>x.id===F.src.slice(2));
    if(r&&r.size>MAX_AI_BYTES)throw new Error('size');
    const b=r&&await fget(r.id);
    if(b){
      if(b.size>MAX_AI_BYTES)throw new Error('size');
      t=await fileText(new File([b],r.name,{type:b.type}));
      F.name=r.name.replace(/\.[^.]+$/,'');
    }
  }
  return t;
}

async function fmake(){
  F.msg='Reading...';F.cards=[];F.sum=[];render();
  try{
    const t=await readFlashSource();
    if(t.trim().length<60)F.msg='Not enough text found. Try another source.';
    else{F.cards=buildCards(t);F.sum=summarize(t);F.msg=F.cards.length?'Built offline (no AI credit used).':'Could not find anything to turn into cards.'}
  }catch(e){
    F.msg=e.message==='size'?'File exceeds the 10 MB maximum limit.':e.message==='net'?'Reading a PDF needs an internet connection the first time.':'Could not read that file. Try a .txt or .pdf, or paste the text.';
  }
  render();
}

async function fmakeAI(){
  if(aiLeft()<=0){
    banner('Daily AI limit reached (2/2 used today). Try again tomorrow!');
    return;
  }
  F.loading=true;F.msg='✨ AI is summarizing and writing multiple-choice flashcards...';F.cards=[];F.sum=[];render();
  try{
    const t=await readFlashSource();
    if(t.trim().length<60){
      F.loading=false;F.msg='Not enough text found (minimum 60 characters).';render();return;
    }
    const promptText=t.slice(0,30000);
    const res=await fetch(AI_WORKER_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:promptText})
    });
    if(!res.ok){
      const errData=await res.json().catch(()=>({}));
      throw new Error((errData.error&&errData.error.message)||('Server Error '+res.status));
    }
    const data=await res.json();
    const raw=data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts[0].text;
    const parsed=JSON.parse(raw);
    F.sum=Array.isArray(parsed.summary)?parsed.summary:[];
    F.cards=(Array.isArray(parsed.cards)?parsed.cards:[]).map(c=>{
      let ch=Array.isArray(c.choices)?c.choices.slice(0,4):[];
      if(!ch.includes(c.a))ch[0]=c.a;
      ch.sort(()=>Math.random()-.5);
      return {q:c.q,a:c.a,choices:ch};
    });
    S.ai.used=(S.ai.used||0)+1;
    S.ai.date=todayStr();
    save();
    F.msg='✨ AI generated '+F.cards.length+' multiple-choice cards & summary! ('+aiLeft()+'/2 AI uses left today)';
  }catch(e){
    if(e.message==='size')F.msg='File exceeds the 10 MB maximum limit.';
    else if(e.message==='net')F.msg='Internet connection required to read PDF or reach AI.';
    else F.msg='AI Error: '+e.message;
  }
  F.loading=false;
  render();
}

case'addlink':{let u=$('#rlurl').value.trim();if(!u){$('#rlurl').focus();return}if(!/^https?:\/\//i.test(u))u='https://'+u;let host=u;try{host=new URL(u).hostname}catch(e){}S.res.push({id:uid(),type:'link',name:$('#rlname').value.trim()||host,url:u,subj:$('#rsubj').value,fav:false,added:Date.now()});save();render();break}
case'nback':hv=null;L=null;B.mode='';render();break;
case'nback2':{const n=S.notes.find(x=>x.id===hv.slice(2));if(n&&!n.title.trim()&&!n.body.trim())S.notes=S.notes.filter(x=>x!==n);save();hv='notes';render();break}
case'allnotes':hv='notes';render();break;
case'newnote':{const n={id:uid(),title:'',body:'',subj:'',pinned:false,updated:Date.now()};S.notes.push(n);save();hv='n:'+n.id;render();$('#ntitle').focus();break}
case'pinnote':{const n=S.notes.find(x=>x.id===hv.slice(2));n.pinned=!n.pinned;save();render();break}
case'delnote':{if(sure(t,'Tap again to delete')){S.notes=S.notes.filter(x=>x.id!==hv.slice(2));save();hv='notes';render()}break}
case'openexams':hv='exams';render();break;
case'addexam':{const n=$('#etitle').value.trim(),dt=$('#edate').value;if(!n){$('#etitle').focus();return}if(!dt){$('#edate').focus();return}S.exams.push({id:uid(),title:n,date:dt,time:$('#etime').value,subj:$('#esubj').value,cover:$('#ecover').value.trim()});save();render();break}
case'addsub':{const n=$('#subname').value.trim();if(!n){$('#subname').focus();return}const s={id:uid(),name:n,color:COLORS[S.subjects.length%COLORS.length],classes:[]};S.subjects.push(s);save();curSub=s.id;render();break}
case'delsubj':{if(sure(t,'Tap again to delete')){[S.exams,S.notes,S.res,S.reviews].forEach(a=>a.forEach(x=>{if(x.subj===curSub)x.subj=''}));S.tasks=S.tasks.filter(x=>x.subj!==curSub);S.subjects=S.subjects.filter(x=>x.id!==curSub);curSub=null;save();render()}break}
case'addclass':{const st=$('#cstart').value;if(!st){$('#cstart').focus();return}subj(curSub).classes.push({id:uid(),day:+$('#cday').value,start:st,end:$('#cend').value,room:$('#croom').value.trim()});save();render();break}
case'addtask':{const n=$('#ttitle').value.trim();if(!n){$('#ttitle').focus();return}S.tasks.push({id:uid(),title:n,subj:curSub,due:$('#tdue').value,time:$('#ttime').value||'23:59',done:false});save();render();break}
case'alerton':{S.alerts=!S.alerts;if(S.alerts){beep();if(window.Notification&&Notification.permission==='default')Notification.requestPermission()}save();render();break}
case'testalert':alertNow('StudySpace','Alerts are working');break;
case'tgo':{readCustom();if(!T.running&&T.left>total())T.left=total();if(T.running){T.running=false}else{T.running=true;T.end=Date.now()+T.left*1000}render();break}
case'treset':{readCustom();resetTimer();render();break}
case'tskip':{nextPhase(false);render();break}
case'reset':{if(sure(t,'Tap again to erase everything')){const th=S.theme;S=blank();S.theme=th;save();curSub=null;hv=null;try{indexedDB.deleteDatabase('studyspace-files')}catch(e){}render()}break}
}});
document.addEventListener('input',e=>{const el=e.target;
if(el.id==='jtext'||el.id==='jgoal'){jent(jd||todayStr())[el.id==='jtext'?'text':'goals']=el.value;save();return}
if(el.id==='rsearch'){rq=el.value;$('#rlist').innerHTML=rlist();return}
if(el.id==='nsearch'){$('#nlist').innerHTML=nlist(el.value);return}
if(el.id==='ntitle'||el.id==='nbody'){const n=S.notes.find(x=>x.id===hv.slice(2));if(n){n[el.id==='ntitle'?'title':'body']=el.value;n.updated=Date.now();save();$('#nsaved').textContent='Saved'}}});
document.addEventListener('change',e=>{
const el=e.target;
if(el.id==='ffile'&&el.files[0]&&el.files[0].size>MAX_AI_BYTES){banner('That file is over 10 MB. Please pick a smaller file.');el.value='';return}
if(el.dataset.habit){const h=S.habits.find(x=>x.id===el.dataset.habit);if(h){if(el.checked)h.days[todayStr()]=1;else delete h.days[todayStr()];save();render()}}
if(el.id==='gsubj'){gs=el.value;render()}
if(el.id==='gtarget'){(S.grades[gs]=S.grades[gs]||{target:90,items:[]}).target=Math.min(100,Math.max(1,+el.value||90));save();render()}
if(el.id==='wbudget'){const v=Math.max(0,+el.value||0),id='bud-'+todayStr().slice(0,7);S.wallet.budget=v;S.wallet.tx=S.wallet.tx.filter(x=>x.id!==id);if(v>0)S.wallet.tx.push({id,type:'in',amt:v,cat:'Monthly budget',note:'',date:todayStr()});save();render()}
if(el.id==='jdate'&&el.value){jd=el.value;render()}
if((el.id==='sbed'||el.id==='swake')&&el.value){S.sleep[el.id==='sbed'?'bed':'wake']=el.value;save();render()}
if(el.id==='rfilter'){rf=el.value;$('#rlist').innerHTML=rlist()}
if(el.id==='resfile'){addFiles(Array.from(el.files));el.value=''}
if(el.id==='nsubj'){const n=S.notes.find(x=>x.id===hv.slice(2));if(n){n.subj=el.value;save()}}
if(el.dataset.done){const x=S.tasks.find(t=>t.id===el.dataset.done);if(x){x.done=el.checked;save();render()}}
if(el.id==='theme'){S.theme=el.value;save();applyTheme()}
if(el.id==='lead'){S.lead=+el.value;save()}
});
render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
</body>
</html>
