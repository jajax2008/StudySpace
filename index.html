<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudySpace</title>
<meta name="theme-color" content="#3d7a5a">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f1f5ef;--ink:#1e2b24;--muted:#5d6e64;--accent:#3d7a5a;--card:#fff;--line:#d9e3da;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111915;--ink:#e5eee8;--muted:#92a69a;--accent:#7cc29e;--card:#1a251f;--line:#29372e;--on:#0f1a14;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111915;--ink:#e5eee8;--muted:#92a69a;--accent:#7cc29e;--card:#1a251f;--line:#29372e;--on:#0f1a14;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:20px 18px 24px}
h1{font-size:28px;font-weight:800;margin:0 0 2px;letter-spacing:-.5px}
h2{font-size:18px;font-weight:600;margin:26px 0 10px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stats{display:flex;gap:10px}
.stats .card{flex:1;padding:12px}
.stats b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.stats span{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}
.row .t div{overflow-wrap:anywhere}
.row small{color:var(--muted)}
.row.done .t div{text-decoration:line-through;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.late{color:#c2410c;font-weight:600}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.form{display:grid;gap:8px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:var(--on);font-weight:600}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.x{background:none;color:var(--muted);padding:4px 8px;font-size:20px;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:5px 6px 5px 12px;font-size:14px}
.chip button{padding:0 6px}
.modes{display:flex;gap:8px;margin-bottom:14px}
.modes button{flex:1;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.modes button.on{background:var(--accent);color:var(--on);border-color:var(--accent)}
.ring{display:block;margin:6px auto 4px;width:min(78vw,300px);height:auto}
.ring text{fill:var(--ink);font-family:inherit}
.ctrl{display:flex;gap:10px;justify-content:center;margin:14px 0}
.ctrl button{min-width:96px}
.empty{color:var(--muted);padding:8px 0}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--muted);border-radius:0;padding:12px 4px;font-size:13px}
nav button.on{color:var(--accent);box-shadow:inset 0 2px 0 var(--accent)}
body>#app{padding-bottom:0}
</style>
</head>
<body>
<div id="app"><main id="view"></main>
<nav><button data-t="home">Home</button><button data-t="acad">Academics</button><button data-t="focus">Focus</button><button data-t="more">More</button></nav></div>
<script>
const COLORS=['#3d7a5a','#c0793b','#5b7fb5','#a45a7c','#8a8f3a'];
const blank=()=>({subjects:[],tasks:[],sessions:[],theme:''});
function load(){try{return Object.assign(blank(),JSON.parse(localStorage.getItem('studyspace1')))}catch(e){return blank()}}
let S=load();
function save(){try{localStorage.setItem('studyspace1',JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayStr=()=>ymd(new Date());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function applyTheme(){if(S.theme)document.documentElement.setAttribute('data-theme',S.theme);else document.documentElement.removeAttribute('data-theme')}
applyTheme();
let tab='home';
const T={mode:'p',f:25,b:5,phase:'focus',left:1500,running:false,end:0};
const PRESETS={p:[25,5],d:[52,17]};
function subj(id){return S.subjects.find(s=>s.id===id)}
function dueLabel(d){if(!d)return'';const t=todayStr();if(d<t)return'<span class="late">Overdue · '+d+'</span>';if(d===t)return'<span class="late">Due today</span>';return'Due '+d}
function focusToday(){return S.sessions.filter(x=>x.date===todayStr()).reduce((a,x)=>a+x.min,0)}
function streak(){const days=new Set(S.sessions.map(x=>x.date));let d=new Date(),n=0;if(!days.has(ymd(d)))d.setDate(d.getDate()-1);while(days.has(ymd(d))){n++;d.setDate(d.getDate()-1)}return n}
function taskRow(t){const s=subj(t.subj);return '<div class="row'+(t.done?' done':'')+'"><input type="checkbox" style="width:22px;height:22px;flex:none" data-done="'+t.id+'"'+(t.done?' checked':'')+' aria-label="Mark done"><span class="dot" style="background:'+(s?s.color:'var(--line)')+'"></span><div class="t"><div>'+esc(t.title)+'</div><small>'+(s?esc(s.name)+' · ':'')+dueLabel(t.due)+'</small></div><button class="x" data-deltask="'+t.id+'" aria-label="Delete">×</button></div>'}
function sortedOpen(){return S.tasks.filter(t=>!t.done).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'))}
function home(){
const h=new Date().getHours(),g=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
const open=sortedOpen();
return '<h1>'+g+'</h1><p class="sub">'+new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})+'</p>'+
'<div class="stats"><div class="card"><b>'+focusToday()+'</b><span>minutes focused</span></div><div class="card"><b>'+streak()+'</b><span>day streak</span></div><div class="card"><b>'+open.length+'</b><span>tasks open</span></div></div>'+
'<h2>Due soon</h2><div class="card">'+(open.length?open.slice(0,5).map(taskRow).join(''):'<div class="empty">Nothing due. Add an assignment in Academics.</div>')+'</div>'+
'<h2>Ready to study?</h2><button data-go="focus" style="width:100%">Start a focus session</button>'}
function acad(){
const chips=S.subjects.map(s=>'<span class="chip"><span class="dot" style="background:'+s.color+'"></span>'+esc(s.name)+'<button class="x" data-delsub="'+s.id+'" aria-label="Delete subject">×</button></span>').join('');
const opts='<option value="">No subject</option>'+S.subjects.map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join('');
const done=S.tasks.filter(t=>t.done);
return '<h1>Academics</h1><p class="sub">Subjects and assignments</p>'+
'<h2 style="margin-top:0">Subjects</h2><div class="chips">'+(chips||'<span class="empty">No subjects yet. Add your first one below.</span>')+'</div>'+
'<div class="form"><div style="display:flex;gap:8px"><input id="subname" placeholder="Subject name, e.g. Mathematics" maxlength="40"><button id="addsub">Add subject</button></div></div>'+
'<h2>New assignment</h2><div class="form"><input id="ttitle" placeholder="What is due?" maxlength="80"><div class="two"><select id="tsubj">'+opts+'</select><input id="tdue" type="date"></div><button id="addtask">Add assignment</button></div>'+
'<h2>To do</h2><div class="card">'+(sortedOpen().length?sortedOpen().map(taskRow).join(''):'<div class="empty">All caught up.</div>')+'</div>'+
(done.length?'<h2>Completed</h2><div class="card">'+done.map(taskRow).join('')+'</div>':'')}
const C=2*Math.PI*90;
function mmss(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function total(){return (T.phase==='focus'?T.f:T.b)*60}
function ringHTML(){const off=C*(1-T.left/total());return '<svg class="ring" viewBox="0 0 220 220" role="img" aria-label="Timer"><circle cx="110" cy="110" r="90" fill="none" stroke="var(--line)" stroke-width="12"/><circle id="arc" cx="110" cy="110" r="90" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'" transform="rotate(-90 110 110)"/><text id="clock" x="110" y="118" text-anchor="middle" font-size="46" font-weight="800">'+mmss(T.left)+'</text><text id="phase" x="110" y="146" text-anchor="middle" font-size="14" style="fill:var(--muted)">'+(T.phase==='focus'?'Focus':'Break')+'</text></svg>'}
function focus(){
return '<h1>Focus Room</h1><p class="sub">Pick a method and start.</p>'+
'<div class="modes"><button data-mode="p" class="'+(T.mode==='p'?'on':'')+'">Pomodoro<br><small>25 / 5</small></button><button data-mode="d" class="'+(T.mode==='d'?'on':'')+'">52 / 17</button><button data-mode="c" class="'+(T.mode==='c'?'on':'')+'">Custom</button></div>'+
(T.mode==='c'?'<div class="two form" style="margin-bottom:8px"><label>Focus minutes<input id="cf" type="number" min="1" max="180" value="'+T.f+'"></label><label>Break minutes<input id="cb" type="number" min="1" max="60" value="'+T.b+'"></label></div>':'')+
'<div id="ringbox">'+ringHTML()+'</div>'+
'<div class="ctrl"><button id="tgo">'+(T.running?'Pause':'Start')+'</button><button class="ghost" id="treset">Reset</button><button class="ghost" id="tskip">Skip</button></div>'+
'<div class="card"><b>'+focusToday()+' minutes</b> focused today across '+S.sessions.filter(x=>x.date===todayStr()).length+' sessions.</div>'}
function more(){
const soon=['Notes','Exam countdown and grade calculator','Wallet','Learning Techniques','Resource Library','Journal and Life Tracker','StudyBuddy AI'];
return '<h1>More</h1><p class="sub">What is coming next</p><div class="card">'+soon.map(x=>'<div class="row"><div class="t">'+x+'</div><small>Planned</small></div>').join('')+'</div>'+
'<h2>Settings</h2><div class="card"><div class="row"><div class="t">Appearance</div><select id="theme" style="width:auto"><option value="">Match phone</option><option value="light">Light</option><option value="dark">Dark</option></select></div>'+
'<div class="row"><div class="t">Your data<br><small>Saved only in this browser on this device.</small></div><button class="ghost" id="reset">Clear all</button></div></div>'}
function render(){
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
const v={home,acad,focus,more}[tab]();
$('#view').innerHTML=v;
if(tab==='more'){$('#theme').value=S.theme}
}
function setMode(m){T.mode=m;if(PRESETS[m]){T.f=PRESETS[m][0];T.b=PRESETS[m][1]}resetTimer()}
function resetTimer(){T.running=false;T.phase='focus';T.left=T.f*60}
function nextPhase(logIt){if(T.phase==='focus'&&logIt){S.sessions.push({date:todayStr(),min:T.f});save()}T.phase=T.phase==='focus'?'break':'focus';T.left=total();T.running=false}
setInterval(()=>{
if(!T.running)return;
T.left=(T.end-Date.now())/1000;
if(T.left<=0){try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}nextPhase(true);if(tab==='focus')render();return}
if(tab==='focus'&&$('#clock')){$('#clock').textContent=mmss(T.left);$('#arc').setAttribute('stroke-dashoffset',C*(1-T.left/total()))}
},250);
document.addEventListener('click',e=>{
const t=e.target.closest('[data-t],[data-go],[data-mode],[data-delsub],[data-deltask],button');if(!t)return;
const d=t.dataset;
if(d.t){tab=d.t;render();return}
if(d.go){tab=d.go;render();return}
if(d.mode){setMode(d.mode);render();return}
if(d.delsub){S.subjects=S.subjects.filter(s=>s.id!==d.delsub);S.tasks.forEach(x=>{if(x.subj===d.delsub)x.subj=''});save();render();return}
if(d.deltask){S.tasks=S.tasks.filter(x=>x.id!==d.deltask);save();render();return}
switch(t.id){
case'addsub':{const n=$('#subname').value.trim();if(!n)return;S.subjects.push({id:uid(),name:n,color:COLORS[S.subjects.length%COLORS.length]});save();render();break}
case'addtask':{const n=$('#ttitle').value.trim();if(!n){$('#ttitle').focus();return}S.tasks.push({id:uid(),title:n,subj:$('#tsubj').value,due:$('#tdue').value,done:false});save();render();break}
case'tgo':{if(T.mode==='c'){T.f=Math.min(180,Math.max(1,+$('#cf').value||25));T.b=Math.min(60,Math.max(1,+$('#cb').value||5));if(!T.running&&T.left===total()||T.left>T.f*60)T.left=(T.phase==='focus'?T.f:T.b)*60}
if(T.running){T.running=false}else{T.running=true;T.end=Date.now()+T.left*1000}render();break}
case'treset':{if(T.mode==='c'){T.f=Math.min(180,Math.max(1,+$('#cf').value||25));T.b=Math.min(60,Math.max(1,+$('#cb').value||5))}resetTimer();render();break}
case'tskip':{nextPhase(false);render();break}
case'reset':{if(confirm('Delete all subjects, assignments and sessions on this device?')){const th=S.theme;S=blank();S.theme=th;save();render()}break}
}});
document.addEventListener('change',e=>{
if(e.target.dataset.done){const x=S.tasks.find(t=>t.id===e.target.dataset.done);if(x){x.done=e.target.checked;save();render()}}
if(e.target.id==='theme'){S.theme=e.target.value;save();applyTheme()}
});
render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
</body>
</html>
