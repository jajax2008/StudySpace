<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudySpace</title>
<meta id="themecolor" name="theme-color" content="#f1f5ef">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f1f5ef;--ink:#1e2b24;--muted:#5d6e64;--accent:#3d7a5a;--card:#fff;--line:#d9e3da;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111915;--ink:#e5eee8;--muted:#92a69a;--accent:#7cc29e;--card:#1a251f;--line:#29372e;--on:#0f1a14;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111915;--ink:#e5eee8;--muted:#92a69a;--accent:#7cc29e;--card:#1a251f;--line:#29372e;--on:#0f1a14;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif);font-size:var(--fs,16px);line-height:1.45}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:20px 18px 24px}
h1{font-size:28px;font-weight:800;margin:0 0 2px;letter-spacing:-.5px}
h2{font-size:18px;font-weight:600;margin:26px 0 10px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stats{display:flex;gap:10px}
.stats .card{flex:1;padding:12px}
.stats b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.stats span{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}
.row .t div{overflow-wrap:anywhere}
small{color:var(--muted)}
.row.done .t div{text-decoration:line-through;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.late{color:#c2410c;font-weight:600}
label{display:block;font-size:13px;color:var(--muted)}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
label input,label select{margin-top:4px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.form{display:grid;gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:var(--on);font-weight:600}

.subcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);margin-bottom:8px;padding:14px;font-weight:400}

.ring{display:block;margin:6px auto 4px;width:min(78vw,300px);height:auto}

.ctrl{display:flex;gap:10px;justify-content:center;margin:14px 0}

.empty{color:var(--muted);padding:8px 0}
.banner{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));max-width:496px;margin:0 auto;background:var(--accent);color:var(--on);padding:14px;border-radius:12px;z-index:9;font-weight:600}

textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;min-height:48vh;resize:vertical}
textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.row.past{opacity:.55}
.row b{white-space:nowrap;font-variant-numeric:tabular-nums;font-size:14px}
.rmain{flex:1;min-width:0;text-align:left;background:none;color:var(--ink);padding:0;font-weight:400}
button:disabled{opacity:.5;cursor:default}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px;font-weight:400;min-height:78px}
.tile b{font-size:16px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.over i{background:#c2410c}
.choice-btn{width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);padding:12px 14px;border-radius:10px;font-weight:500;margin-bottom:8px}
.choice-btn.correct{background:#16a34a;color:#fff;border-color:#16a34a}
.choice-btn.wrong{background:#dc2626;color:#fff;border-color:#dc2626}
.chat-box{display:flex;flex-direction:column;gap:10px;max-height:42vh;overflow-y:auto;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
.bubble{padding:10px 12px;border-radius:12px;max-width:88%;white-space:pre-wrap;font-size:14px}
.bubble.u{align-self:flex-end;background:var(--accent);color:var(--on)}
.bubble.a{align-self:flex-start;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
:root{--ease:cubic-bezier(.22,.8,.3,1)}
*{-webkit-tap-highlight-color:transparent}
button,select,input,textarea{touch-action:manipulation}
body{transition:background-color .5s var(--ease),color .5s var(--ease)}
.card,.subcard,.tile,button,nav button{transition:transform .25s var(--ease),background-color .35s var(--ease),border-color .35s var(--ease),color .35s var(--ease),opacity .3s var(--ease)}
button:active:not(:disabled),.tile:active,.subcard:active{transform:scale(.97)}
.bar i{transition:width .9s var(--ease)}
.rise{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0)*50ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
nav{position:relative}
#navind{position:absolute;top:0;left:0;height:3px;background:var(--accent);border-radius:0 0 4px 4px;transition:transform .55s var(--ease)}
nav button.on{box-shadow:none}
.banner{animation:bannerIn .5s var(--ease) both}
@keyframes bannerIn{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
.bubble:last-child{animation:rise .45s var(--ease) both}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.confetti i{position:absolute;top:0;left:0;border-radius:3px;will-change:transform,opacity}
.breath{display:flex;flex-direction:column;align-items:center;gap:12px;padding:10px 0 4px}
#brcircle{width:120px;height:120px;border-radius:50%;background:var(--accent);opacity:.85;transform:scale(.6);transition:transform 4s ease-in-out}
.hot a{display:inline-block;margin:6px 6px 0 0;padding:8px 12px;border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;background:var(--bg)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;transition-duration:.001ms!important}}
button,textarea{font-family:inherit}
#onb{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.obc{width:100%;max-width:400px}.obc label{display:block;margin-bottom:14px}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sw{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}.sw i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.cols input{height:42px;padding:3px}
.buddies{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px}
.bcard{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:4px;transition:transform .15s}
.bcard:active{transform:scale(.97)}.bcard small{color:var(--muted)}
.bud{width:58px;height:58px;overflow:visible;animation:bob 3.4s ease-in-out infinite}
.bud .bd{fill:color-mix(in srgb,var(--bc) 24%,var(--card));stroke:var(--bc);stroke-width:2}
.bud .ey{fill:var(--ink);transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.bud .ey.b{animation-delay:.04s}
.bud .mo{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.bud .ac{fill:var(--bc)}.bud .ck{fill:var(--bc);opacity:.35}
.bud .wv{fill:color-mix(in srgb,var(--bc) 24%,var(--card));stroke:var(--bc);stroke-width:2;transform-origin:49px 44px;animation:wave 3s ease-in-out infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes wave{0%,55%,100%{transform:rotate(0)}65%{transform:rotate(-24deg)}75%{transform:rotate(8deg)}85%{transform:rotate(-20deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){.bud,.bud .ey,.bud .wv{animation:none!important}}
.kate{display:flex;align-items:center;gap:12px;position:relative;background:color-mix(in srgb,#d9667a 12%,var(--card));border:1px solid color-mix(in srgb,#d9667a 35%,var(--line));border-radius:14px;padding:14px;margin-bottom:14px}
.kate p{margin:0;line-height:1.4}
.kh{flex:none;width:38px;height:38px;padding:0;background:none;border:0;cursor:pointer;color:#d9667a;display:grid;place-items:center}
.kh svg{width:34px;height:34px;fill:currentColor;animation:khb 2.6s ease-in-out infinite}
.kh.pop svg{animation:khp .7s cubic-bezier(.3,1.6,.5,1)}
.kf{position:absolute;left:30px;top:22px;color:#d9667a;font-size:14px;pointer-events:none;opacity:0;animation:kfl 1.5s ease-out forwards}
@keyframes khb{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
@keyframes khp{0%{transform:scale(1)}35%{transform:scale(1.45) rotate(-8deg)}70%{transform:scale(.92) rotate(4deg)}100%{transform:scale(1)}}
@keyframes kfl{0%{opacity:0;transform:translate(0,0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-70px) scale(1.1)}}
@media (prefers-reduced-motion:reduce){.kh svg,.kh.pop svg,.kf{animation:none!important}}
nav{display:none!important}
.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:24px 0 8px}
.nx{background:color-mix(in srgb,var(--accent) 12%,var(--card));margin:0 0 10px}
.hg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ht{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:500;font-size:13px;min-width:0}
.ht small{color:var(--muted);font-weight:400;font-size:11px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ht svg{width:26px;height:26px;fill:none;stroke:var(--accent);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ht:active{transform:scale(.97)}
.cdc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.cdt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}.cdt span{font-weight:600}.cdt small{color:var(--muted)}
.tm{display:flex;align-items:flex-start;justify-content:center;gap:4px;font-family:ui-monospace,"SF Mono","Roboto Mono","Courier New",monospace;color:var(--cd,var(--accent))}
.tm .sg{display:flex;flex-direction:column;align-items:center;background:color-mix(in srgb,var(--cd,var(--accent)) 10%,var(--card));border:1px solid color-mix(in srgb,var(--cd,var(--accent)) 28%,var(--line));border-radius:10px;padding:8px 6px 5px;min-width:56px}
.tm b{font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:1px;text-shadow:0 0 12px color-mix(in srgb,var(--cd,var(--accent)) 45%,transparent)}
.tm small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.tm i{font-style:normal;font-size:26px;font-weight:700;line-height:1.35;animation:cdb 1s steps(1) infinite}
@keyframes cdb{50%{opacity:.25}}
@media (max-width:360px){.tm b{font-size:24px}.tm .sg{min-width:46px}}
@media (prefers-reduced-motion:reduce){.tm i{animation:none}}
.bud .zz{display:none;font-size:12px;font-weight:700;fill:var(--bc)}
.bud.sleepy .zz{display:block;animation:zz 2.6s ease-in-out infinite}
.bud.sleepy .ey{animation:none;transform:scaleY(.15)}.bud.sleepy .wv{animation:none}
@keyframes zz{0%{opacity:0;transform:translateY(6px)}50%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.bud.sleepy .zz{animation:none}}
.tacc{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:10px;margin-bottom:10px}
.tacc h3{margin:0 0 6px;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tcols{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--ink)}
.tcols>div{min-height:48px;padding:6px 8px}
.tcols>div:first-child{border-right:2px solid var(--ink)}
.tcols .hd{display:block;text-align:center;color:var(--muted);margin-bottom:2px}
.tl{display:flex;justify-content:space-between;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-size:15px;padding:2px 0}
.tl button{padding:0 8px;background:none;color:var(--muted);font-size:18px}
.ttot{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);font-weight:600;font-variant-numeric:tabular-nums}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keys button{padding:14px 0;font-size:20px;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.keys button.op{background:var(--bg)}
.keys button.eq{background:var(--accent);color:var(--on);border-color:var(--accent)}
.cdisp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;text-align:right}
.cdisp .ex{color:var(--muted);min-height:20px;overflow-wrap:anywhere;font-size:14px}
.cdisp .rs{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
</style>
<script>
// Safety net. If the app fails to start, show a recovery card. Once it is running, a stray error only shows a small banner and never wipes the screen or your data.
window.ssBackup=function(){try{var raw=localStorage.getItem('studyspace1')||'{}';var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([raw],{type:'application/json'}));a.download='studyspace-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove()}catch(e){}};
window.ssReload=function(){try{if(navigator.serviceWorker)navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){x.unregister()})});if(window.caches)caches.keys().then(function(k){k.forEach(function(c){if(c.indexOf('studyspace-')===0)caches.delete(c)})})}catch(e){}setTimeout(function(){location.href=location.pathname+'?fresh='+Date.now()},400)};
function ssFail(msg,line){
  if(!window.__booted){
    var v=document.getElementById('view');
    if(v){v.innerHTML='<div class="card"><h2>The app could not start</h2><p><small>'+String(msg).replace(/[<>&]/g,' ')+(line?' (Line '+line+')':'')+'</small></p><p><small>Your data has not been touched.</small></p><div class="two"><button onclick="ssReload()">Reload app</button><button class="ghost" onclick="ssBackup()">Download my data</button></div></div>';return}
  }
  var b=document.getElementById('errbn');
  if(!b){b=document.createElement('div');b.id='errbn';b.className='banner';b.setAttribute('role','alert');b.onclick=function(){b.remove()};document.body.appendChild(b)}
  b.textContent='Something went wrong ('+String(msg).slice(0,80)+'). Your data is safe. Tap to dismiss.';
}
window.addEventListener('error',function(e){ssFail(e.message||'Unknown error',e.lineno)});
window.addEventListener('unhandledrejection',function(e){ssFail((e.reason&&e.reason.message)||'A request failed')});
</script>
</head>
<body>
<div id="app">
  <main id="view">
    <h1>StudySpace</h1>
    <p class="sub">Starting up...</p>
    <div class="card">
      <p style="margin:0 0 10px">If this screen does not update automatically, tap below to clear old cached files:</p>
      <button onclick="ssReload()">Clear Cache &amp; Open App</button>
    </div>
  </main>
  <nav>
    <button data-t="home" class="on">Home</button>
    <button data-t="acad">Academics</button>
    <button data-t="focus">Focus</button>
    <button data-t="life">Life</button>
    <button data-t="more">More</button>
  </nav>
</div>
<script>
const COLORS=['#3d7a5a','#c0793b','#5b7fb5','#a45a7c','#8a8f3a'];
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const AI_WORKER_URL='https://studyspace-ai.jasper-esclamado02.workers.dev';
const MAX_AI_MB=10;
const MAX_AI_BYTES=MAX_AI_MB*1024*1024;
const MAX_AI_DAILY=2;
const MAX_BUDDY_DAILY=30;
const MAX_LIFE_DAILY=40;
let DEVID='';try{DEVID=localStorage.getItem('studyspace-dev')||'';if(!DEVID){DEVID=(Date.now().toString(36)+Math.random().toString(36).slice(2,10)).slice(0,24);localStorage.setItem('studyspace-dev',DEVID)}}catch(e){}

const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayStr=()=>ymd(new Date());

// Universal sentence splitter (no lookbehind regex so older mobile WebViews never crash)
function splitSents(t){
  return String(t||'').replace(/([.!?])\s+/g,'$1\n').split(/\n+/).map(x=>x.trim()).filter(Boolean);
}

const blank=()=>({
  subjects:[],tasks:[],sessions:[],exams:[],notes:[],decks:[],res:[],reviews:[],grades:{},
  wallet:{tx:[],avail:0,goals:[]},journal:{},habits:[],sleep:{bed:'22:30',wake:'06:00'},
  theme:'',alerts:false,lead:10,fired:{},
  ai:{date:todayStr(),used:0,onlineUsed:0,offlineUsed:0,mode:'online'},
  lb:{date:todayStr(),used:0,noted:false},
  prof:{name:'',age:'',level:'',done:false},ui:{},
  acct:{doc:'',name:'',chat:[],pads:[],calc:[]}
});

function load(){
  let d=blank();
  try{
    const raw=JSON.parse(localStorage.getItem('studyspace1')||'{}');
    if(raw&&typeof raw==='object')d=Object.assign(d,raw);
  }catch(e){}
  ['subjects','tasks','sessions','exams','notes','decks','res','reviews','habits'].forEach(k=>{
    if(!Array.isArray(d[k]))d[k]=[];
  });
  if(!d.grades||typeof d.grades!=='object')d.grades={};
  if(!d.journal||typeof d.journal!=='object')d.journal={};
  if(!d.fired||typeof d.fired!=='object')d.fired={};
  if(!d.sleep||typeof d.sleep!=='object')d.sleep={bed:'22:30',wake:'06:00'};
  if(!d.wallet||typeof d.wallet!=='object')d.wallet={tx:[],avail:0,goals:[]};
  if(!Array.isArray(d.wallet.goals))d.wallet.goals=[];
  if(!Array.isArray(d.wallet.tx))d.wallet.tx=[];
  if(typeof d.wallet.avail!=='number')d.wallet.avail=Number(d.wallet.budget)||0;
  d.wallet.tx=d.wallet.tx.filter(t=>t&&t.type==='out');
  d.subjects.forEach(s=>{if(s)s.classes=Array.isArray(s.classes)?s.classes:[]});
  d.tasks.forEach(t=>{if(t)t.time=t.time||'23:59'});
  d.habits.forEach(h=>{if(h&&(!h.days||typeof h.days!=='object'))h.days={}});
  if(!d.ai||typeof d.ai!=='object')d.ai={date:todayStr(),used:0,onlineUsed:0,offlineUsed:0,mode:'online'};
  delete d.ai.key;
  if(d.ai.date!==todayStr()){
    d.ai.date=todayStr();
    d.ai.used=0;
    d.ai.onlineUsed=0;
    d.ai.offlineUsed=0;
  }
  if(!d.ai.mode)d.ai.mode='online';
  if(!d.lb||typeof d.lb!=='object')d.lb={date:todayStr(),used:0,noted:false};
  if(d.lb.date!==todayStr()){d.lb.date=todayStr();d.lb.used=0}
  Object.keys(d.fired).forEach(k=>{if(d.fired[k]===1)d.fired[k]=Date.now()});
  return d;
}

let S=load();
function save(){try{localStorage.setItem('studyspace1',JSON.stringify(S))}catch(e){}}
function checkAiDay(){
  if(S.ai.date!==todayStr()){

function applyUI(){
  const r=document.documentElement.style,u=ud();
  ['--bg','--ink','--muted','--accent','--card','--line','--on','--font','--fs','--cd'].forEach(k=>r.removeProperty(k));
  const bg=okc(u.bg)?u.bg:'',ac=okc(u.accent)?u.accent:'';
  const w=bg&&lumi(bg)<.5?'#ffffff':'#000000';
  const ink=okc(u.ink)?u.ink:(bg?(w==='#ffffff'?'#f2f2f2':'#1c1c1c'):'');
  if(bg){r.setProperty('--bg',bg);r.setProperty('--card',mixc(bg,w,.07));r.setProperty('--line',mixc(bg,w,.16));const m=document.getElementById('themecolor');if(m)m.setAttribute('content',bg)}
  if(ink){r.setProperty('--ink',ink);r.setProperty('--muted',mixc(ink,bg||(lumi(ink)<.5?'#ffffff':'#000000'),.4))}
  if(ac){r.setProperty('--accent',ac);r.setProperty('--on',lumi(ac)>.6?'#111111':'#ffffff')}
  if(okc(u.cd))r.setProperty('--cd',u.cd);
  let f=FONTS[u.font];
  const fd=u.font==='Custom'?lsGet('studyspace-font'):'';
  st('ufont',fd?'@font-face{font-family:"UserFont";src:url('+fd+')}':'');
  if(fd)f='"UserFont",system-ui,sans-serif';
  if(f)r.setProperty('--font',f);
  const fs={S:'15px',L:'18px'}[u.fs];if(fs)r.setProperty('--fs',fs);
  const img=u.bgimg?lsGet('studyspace-bgimg'):'';
  st('ubg',img?'body{background-image:linear-gradient(color-mix(in srgb,var(--bg) 82%,transparent),color-mix(in srgb,var(--bg) 82%,transparent)),url('+img+');background-size:cover;background-position:center;background-attachment:fixed}':'');
}

function sndSet(k){
  try{
    if(SND.src){SND.src.stop();SND.src.disconnect();SND.src=null}
    SND.kind=k;if(k==='off')return;
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    const c=SND.ctx=SND.ctx||new C();if(c.resume)c.resume();
    const n=c.sampleRate*3,buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);let l=0;
    for(let i=0;i<n;i++){const w=Math.random()*2-1;if(k==='brown'){l=(l+.02*w)/1.02;d[i]=l*3.5}else d[i]=w*.5}
    const s=c.createBufferSource(),f=c.createBiquadFilter();s.buffer=buf;s.loop=true;
    if(k==='rain'){f.type='bandpass';f.frequency.value=1800;f.Q.value=.5}else{f.type='lowpass';f.frequency.value=k==='white'?9000:1200}
    SND.g=SND.g||c.createGain();SND.g.gain.value=.4;s.connect(f);f.connect(SND.g);SND.g.connect(c.destination);s.start();SND.src=s;
  }catch(e){banner('Sound is not available on this device.')}
}

const ACCT_MAX_DOC=45000;
const ACT={sub:'tutor',busy:false,q:'',a:'',paste:'',msg:'',expr:'',res:'0',last:0};
const fmtN=n=>isFinite(n)?(Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'Error';
const TA_NAMES=['Cash','Accounts Receivable','Allowance for Doubtful Accounts','Merchandise Inventory','Accounts Payable','Sales','Purchases','Sales Returns'];

function acctState(){const A=S.acct=S.acct||{};A.doc=A.doc||'';A.name=A.name||'';A.chat=A.chat||[];A.pads=A.pads||[];A.calc=A.calc||[];return A}

async function docxText(file){
  const buf=new Uint8Array(await file.arrayBuffer()),dv=new DataView(buf.buffer);
  let e=buf.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Error('docx');
  const cnt=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true),found=null;
  for(let i=0;i<cnt;i++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const method=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    if(new TextDecoder().decode(buf.subarray(p+46,p+46+nl))==='word/document.xml'){found={method,csize,off};break}
    p+=46+nl+xl+cl;
  }
  if(!found)throw new Error('docx');
  const ln=dv.getUint16(found.off+26,true),lx=dv.getUint16(found.off+28,true),st=found.off+30+ln+lx,data=buf.subarray(st,st+found.csize);
  let xml;
  if(found.method===0)xml=new TextDecoder().decode(data);
  else xml=await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  return xml.replace(/<w:tab\/>/g,'\t').replace(/<w:br[^>]*\/>/g,'\n').replace(/<\/w:p>\s*<\/w:tc>/g,'</w:tc>').replace(/<\/w:tc>/g,' | ').replace(/<\/w:tr>/g,'\n').replace(/<\/w:p>/g,'\n').replace(/<[^>]+>/g,'').replace(/ \| (\n|$)/g,'$1')
    .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&').replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
}

async function askAccounting(){
  const A=acctState();
  if(ACT.busy)return;
  const q=($('#acq')||{value:ACT.q}).value.trim(),a=($('#aca')||{value:ACT.a}).value.trim();
  ACT.q=q;ACT.a=a;ACT.msg='';
  if(!A.doc){ACT.msg='Add the assessment first so the tutor can read its rules.';render();return}
  if(a.length<3){ACT.msg='Write your own attempt first, even a rough guess. Then I can help.';render();return}
  const hist=A.chat.filter(m=>!m.x).slice(-10).map(m=>({role:m.role==='u'?'user':'model',text:m.text.slice(0,1200)}));
  A.chat.push({role:'u',text:(q?'Working on: '+q+'\n\n':'')+'My attempt: '+a});
  ACT.q='';ACT.a='';ACT.busy=true;save();render();
  try{
    const ctrl=new AbortController(),tid=setTimeout(()=>ctrl.abort(),65000);
    const res=await fetch(AI_WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'accounting',name:(S.prof&&S.prof.name)||'',doc:A.doc,question:q,attempt:a,history:hist,device:DEVID}),signal:ctrl.signal});
    clearTimeout(tid);
    if(res.status===429)A.chat.push({role:'a',text:'I have reached my limit for today, so I have to stop here. Keep working on your own, and I will be back tomorrow.',x:true});
    else if(!res.ok){const ed=await res.json().catch(()=>({}));throw new Error((ed.error&&ed.error.message)||('Server error '+res.status))}
    else{
      const data=await res.json();
      const parts=(data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts)||[];
      const tp=parts.find(p=>p.text&&!p.thought)||parts[0];
      const reply=(tp&&tp.text||'').trim();
      A.chat.push({role:'a',text:reply||'I could not form a reply. Try wording your attempt a little differently.',x:!reply});
    }
  }catch(e){A.chat.push({role:'a',text:'I could not reach the tutor just now ('+String(e.message).slice(0,120)+'). Try again in a moment.',x:true})}
  ACT.busy=false;A.chat=A.chat.slice(-40);save();render();
}
async function acLoadFile(f){
  if(!f)return;
  const A=acctState();
  ACT.msg='Reading...';render();
  try{
    const t=(await fileText(f)).trim();
    if(t.length<80)throw new Error('short');
    A.doc=t.slice(0,ACCT_MAX_DOC);A.name=f.name;
    ACT.msg=t.length>ACCT_MAX_DOC?'Only the first '+ACCT_MAX_DOC.toLocaleString()+' characters were kept.':'';
    save();
  }catch(e){ACT.msg=e.message==='size'?'That file is too large.':e.message==='short'?'Not enough readable text. Try pasting it instead.':'Could not read that file. Try pasting the text instead.'}
  render();
}

/* calculator */
function acEval(s){
  const t=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/(\d+(?:\.\d+)?)%/g,'($1/100)');
  if(!t.trim()||!/^[0-9+\-*/().\s]+$/.test(t))return null;
  try{const v=Function('"use strict";return ('+t+')')();return typeof v==='number'&&isFinite(v)?v:null}catch(e){return null}
}
function acCalc(){
  const K=[['C','op'],['(','op'],[')','op'],['÷','op'],['7'],['8'],['9'],['×','op'],['4'],['5'],['6'],['−','op'],['1'],['2'],['3'],['+','op'],['0'],['00'],['.'],['⌫','op'],['%','op'],['Ans','op']];
  const keys=K.map(k=>'<button class="'+(k[1]||'')+'" data-ck="'+k[0]+'">'+k[0]+'</button>').join('')+'<button class="eq" data-ck="=" style="grid-column:span 2">=</button>';
  const hist=acctState().calc.slice().reverse().map(h=>'<div class="row" style="padding:6px 0"><div class="t"><small>'+esc(h.e)+'</small></div><b>'+esc(h.r)+'</b></div>').join('');
  return'<div style="margin-top:12px"><div class="cdisp"><div class="ex" id="acex">'+esc(ACT.expr)+'</div><div class="rs" id="acrs">'+esc(ACT.res)+'</div></div><div class="keys">'+keys+'</div>'+(hist?'<h2>Recent</h2><div class="card">'+hist+'</div>':'')+
  '<h2>Chain discount</h2><div class="form"><div class="two"><label>List price<input id="cdp" type="number" step="any"></label><label>Discounts % (comma)<input id="cdd" placeholder="20,10,5"></label></div><button class="ghost" id="cdgo">Compute</button><div class="card" id="cdout" style="display:none"></div></div>'+
  '<h2>Depreciation</h2><div class="form"><div class="two"><label>Cost<input id="dpc" type="number" step="any"></label><label>Salvage<input id="dps" type="number" step="any"></label></div><div class="two"><label>Life (years)<input id="dpl" type="number" min="1" step="1"></label><label>Method<select id="dpm"><option value="sl">Straight-line</option><option value="ddb">Double-declining</option><option value="syd">Sum-of-years</option></select></label></div><button class="ghost" id="dpgo">Compute</button><div class="card" id="dpout" style="display:none"></div></div></div>';

function acKey(v){
  if(v==='C'){ACT.expr='';ACT.res='0'}
  else if(v==='⌫')ACT.expr=ACT.expr.slice(0,-1);
  else if(v==='Ans')ACT.expr+=String(ACT.last||0);
  else if(v==='='){
    const r=acEval(ACT.expr);
    if(r===null){ACT.res='Check the entry'}
    else{ACT.res=fmtN(r);ACT.last=r;const A=acctState();A.calc.push({e:ACT.expr,r:ACT.res});A.calc=A.calc.slice(-6);ACT.expr=String(Math.round(r*1e6)/1e6);save();render();return}
  }else ACT.expr+=v;
  if(v!=='='&&v!=='C'){const r=acEval(ACT.expr);if(r!==null)ACT.res=fmtN(r)}
  if(!ACT.expr)ACT.res='0';
  const ex=$('#acex'),rs=$('#acrs');if(ex)ex.textContent=ACT.expr;if(rs)rs.textContent=ACT.res;
}

}

/* STUDYBUDDY DUAL ONLINE / INSTANT OFFLINE AI (20 QUERIES/DAY EACH) */
let B={mode:'',cards:[],i:0,show:false,picked:null,ok:0,miss:[],sum:null,nid:'',text:'',chat:[],q:'',busy:false};

const bsrc=()=>{const el=$('#btext');const t=el?el.value.trim():B.text.trim();if(t)return t;const n=S.notes.find(x=>x.id===($('#bnote')?$('#bnote').value:B.nid));return n?n.body:''};
function summarize(t,n){n=n||4;const ss=splitSents(t).filter(x=>x.length>20);if(ss.length<=n)return ss;
const stop=new Set('the and that with this from have for are was were which their there about into when what your you can not but'.split(' ')),f={};
(t.toLowerCase().match(/[a-z]{4,}/g)||[]).forEach(w=>{if(!stop.has(w))f[w]=(f[w]||0)+1});
return ss.map((x,i)=>({i,x,s:(x.toLowerCase().match(/[a-z]{4,}/g)||[]).reduce((a,w)=>a+(f[w]||0),0)/Math.sqrt(x.length)})).sort((a,b)=>b.s-a.s).slice(0,n).sort((a,b)=>a.i-b.i).map(o=>o.x)}
function makeCards(t){const c=[];String(t||'').split(/\n+/).forEach(l=>{if(l.length>220)return;const m=l.match(/^\s*[-•*\d.)\s]*(.{2,60}?)\s*(?::|=| - | – | — )\s*(.{3,})$/);if(m)c.push({q:m[1].trim(),a:m[2].trim()})});return c}

function offlineSmartAnswer(q,ctx){
  const allText=(ctx?ctx+'\n':'')+S.notes.map(n=>noteTitle(n)+': '+n.body).join('\n');
  if(!allText.trim())return'Paste some text or select a note below first so I can answer your questions offline!';
  const ql=q.toLowerCase();
  if(ql.includes('summar')||ql.includes('key point')||ql.includes('main idea')){
    const pts=summarize(ctx||allText,5);
    return pts.length?'Key Summary Points:\n• '+pts.join('\n• '):'Not enough text to summarize yet.';
  }
  if(ql.includes('quiz')||ql.includes('question')||ql.includes('test me')||ql.includes('flashcard')){
    const cds=buildCards(ctx||allText).slice(0,5);
    return cds.length?'Practice Questions:\n'+cds.map((c,i)=>(i+1)+'. '+c.q+'\n   Ans: '+c.a).join('\n\n'):'Try adding a longer note to generate practice questions.';
  }
  const words=(ql.match(/[a-z0-9]{3,}/g)||[]).filter(w=>!['what','when','where','which','explain','tell','about','from','does','mean','define','how','why','who'].includes(w));
  const sents=splitSents(allText).filter(s=>s.length>12);
  if(!words.length)return'Key points from your notes:\n• '+summarize(allText,4).join('\n• ');
  const scored=sents.map(s=>{
    const low=s.toLowerCase();
    let sc=0;words.forEach(w=>{if(low.includes(w))sc+=(low.indexOf(w)===0?4:2)});
    return {s,sc};
  }).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,4);
  if(scored.length)return'Here is what your notes say:\n• '+scored.map(x=>x.s).join('\n• ');
  return'No exact match for "'+q+'" in your current notes. Top points from your study text:\n• '+summarize(allText,3).join('\n• ');
}

async function askStudyBuddy(){
  const inp=$('#bask');
  const q=(inp?inp.value:B.q).trim();
  if(!q||B.busy)return;
  const ctx=bsrc();
  if($('#bnote'))B.nid=$('#bnote').value;
  if($('#btext'))B.text=$('#btext').value;
  const mode=S.ai.mode||'online';
  if(mode==='device'){await askDevice(q,ctx);return}

  if(mode==='online'){
    if(buddyOnlineLeft()<=0){banner('Daily Online AI limit reached ('+MAX_BUDDY_DAILY+'/'+MAX_BUDDY_DAILY+'). Switch to Offline Mode!');return;}
    B.chat.push({role:'u',text:q});
    B.q='';B.busy=true;render();
    try{
      const notesCtx=ctx||S.notes.slice(0,5).map(n=>noteTitle(n)+': '+n.body).join('\n\n');
      const ctrl=new AbortController();
      const tid=setTimeout(()=>ctrl.abort(),50000);
      const res=await fetch(AI_WORKER_URL,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({mode:'chat',question:q,context:notesCtx,device:DEVID}),
        signal:ctrl.signal
      });
      clearTimeout(tid);
      if(!res.ok){
        const errData=await res.json().catch(()=>({}));
        throw new Error((errData.error&&errData.error.message)||('Server Error '+res.status));
      }
      const data=await res.json();
      const parts=(data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts)||[];
      const textPart=parts.find(p=>p.text&&!p.thought)||parts[0];
      const reply=(textPart&&textPart.text)||'No response generated.';
      S.ai.onlineUsed=(S.ai.onlineUsed||0)+1;save();
      B.chat.push({role:'a',text:reply});
    }catch(e){
      const msg=e.name==='AbortError'?'Request timed out. Switched to instant Offline answer:\n\n'+offlineSmartAnswer(q,ctx):'Online AI notice ('+e.message+'). Instant Offline answer:\n\n'+offlineSmartAnswer(q,ctx);
      B.chat.push({role:'a',text:msg});
    }
    B.busy=false;render();
  }else{
    if(buddyOfflineLeft()<=0){banner('Daily Offline AI limit reached ('+MAX_BUDDY_DAILY+'/'+MAX_BUDDY_DAILY+'). Try again tomorrow!');return;}
    B.chat.push({role:'u',text:q});
    B.q='';
    const reply=offlineSmartAnswer(q,ctx);
    S.ai.offlineUsed=(S.ai.offlineUsed||0)+1;save();
    B.chat.push({role:'a',text:reply});
    render();
  }
}

const WEBLLM_URL='https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.79/+esm';
const DEVMODELS={
  tiny:{label:'Tiny: fastest, simple answers',pre:'SmolLM2-360M-Instruct-',mb:'about 200 MB'},
  small:{label:'Small: recommended',pre:'Qwen2.5-0.5B-Instruct-',mb:'about 400 MB'},
  med:{label:'Medium: smarter but slower',pre:'Qwen2.5-1.5B-Instruct-',mb:'about 1 GB'}
};
const DEV={state:'idle',pct:0,msg:'',id:'',check:''};
let WL=null,ENG=null,AITEST='';
async function wlib(){if(!WL)WL=await import(WEBLLM_URL);return WL}
async function pickModelId(key){
  const w=await wlib();
  const ids=w.prebuiltAppConfig.model_list.map(m=>m.model_id);
  const pre=(DEVMODELS[key]||DEVMODELS.small).pre;
  let f16=false;
  try{const ad=await navigator.gpu.requestAdapter();f16=!!(ad&&ad.features.has('shader-f16'))}catch(e){}
  const c=ids.filter(i=>i.startsWith(pre));
  const id=c.find(i=>i.includes(f16?'q4f16_1':'q4f32_1'))||c.find(i=>i.includes('q4'))||c[0];
  if(!id)throw new Error('That model is not available in this version of the AI engine.');
  return id;
}
