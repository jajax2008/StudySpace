<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudySpace</title>
<meta id="themecolor" name="theme-color" content="#f1f5ef">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#f1f5ef;--ink:#1e2b24;--muted:#5d6e64;--accent:#3d7a5a;--card:#fff;--line:#d9e3da;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111915;--ink:#e5eee8;--muted:#92a69a;--accent:#7cc29e;--card:#1a251f;--line:#29372e;--on:#0f1a14;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111915;--ink:#e5eee8;--muted:#92a69a;--accent:#7cc29e;--card:#1a251f;--line:#29372e;--on:#0f1a14;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--font,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif);font-size:var(--fs,16px);line-height:1.45}
#app{width:100%;max-width:min(520px,100vw);margin:0 auto;height:100%;height:100dvh;display:flex;flex-direction:column;overflow-x:hidden}
main{flex:1;min-width:0;position:relative;overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable;padding:20px 18px 24px}
h1{font-size:28px;font-weight:800;margin:0 0 2px;letter-spacing:-.5px}
h2{font-size:18px;font-weight:600;margin:26px 0 10px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stats{display:flex;gap:10px}
.stats .card{flex:1;padding:12px}
.stats b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.stats span{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}
.row .t div{overflow-wrap:anywhere}
small{color:var(--muted)}
.row.done .t div{text-decoration:line-through;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.late{color:#c2410c;font-weight:600}
label{display:block;font-size:13px;color:var(--muted)}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
label input,label select{margin-top:4px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.form{display:grid;gap:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:var(--on);font-weight:600}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.x{background:none;color:var(--muted);padding:4px 8px;font-size:20px;line-height:1}
.subcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);margin-bottom:8px;padding:14px;font-weight:400}
.subcard .t{flex:1;min-width:0}
.modes{display:flex;gap:8px;margin-bottom:14px}
.modes button{flex:1;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.modes button.on{background:var(--accent);color:var(--on);border-color:var(--accent)}
.ring{display:block;margin:6px auto 4px;width:min(78vw,300px);height:auto}
.ring text{fill:var(--ink);font-family:inherit}
.ctrl{display:flex;gap:10px;justify-content:center;margin:14px 0}
.ctrl button{min-width:96px}
.empty{color:var(--muted);padding:8px 0}
.banner{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));max-width:496px;margin:0 auto;background:var(--accent);color:var(--on);padding:14px;border-radius:12px;z-index:9;font-weight:600}
nav{display:flex;border-top:1px solid var(--line);background:var(--card)}
nav button{flex:1;background:none;color:var(--muted);border-radius:0;padding:12px 2px;font-size:12px}
nav button.on{color:var(--accent);box-shadow:inset 0 2px 0 var(--accent)}
textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;min-height:48vh;resize:vertical}
textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.row.past{opacity:.55}
.row b{white-space:nowrap;font-variant-numeric:tabular-nums;font-size:14px}
.rmain{flex:1;min-width:0;text-align:left;background:none;color:var(--ink);padding:0;font-weight:400}
button:disabled{opacity:.5;cursor:default}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px;font-weight:400;min-height:78px}
.tile b{font-size:16px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.over i{background:#c2410c}
.choice-btn{width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);padding:12px 14px;border-radius:10px;font-weight:500;margin-bottom:8px}
.choice-btn.correct{background:#16a34a;color:#fff;border-color:#16a34a}
.choice-btn.wrong{background:#dc2626;color:#fff;border-color:#dc2626}
.chat-box{display:flex;flex-direction:column;gap:10px;max-height:42vh;overflow-y:auto;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
.bubble{padding:10px 12px;border-radius:12px;max-width:88%;white-space:pre-wrap;font-size:14px}
.bubble.u{align-self:flex-end;background:var(--accent);color:var(--on)}
.bubble.a{align-self:flex-start;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
:root{--ease:cubic-bezier(.22,.8,.3,1)}
*{-webkit-tap-highlight-color:transparent}
button,select,input,textarea{touch-action:manipulation}
body{transition:background-color .5s var(--ease),color .5s var(--ease)}
.card,.subcard,.tile,button,nav button{transition:transform .25s var(--ease),background-color .35s var(--ease),border-color .35s var(--ease),color .35s var(--ease),opacity .3s var(--ease)}
button:active:not(:disabled),.tile:active,.subcard:active{transform:scale(.97)}
.bar i{transition:width .9s var(--ease)}
.rise{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0)*50ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
nav{position:relative}
#navind{position:absolute;top:0;left:0;height:3px;background:var(--accent);border-radius:0 0 4px 4px;transition:transform .55s var(--ease)}
nav button.on{box-shadow:none}
.banner{animation:bannerIn .5s var(--ease) both}
@keyframes bannerIn{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
.bubble:last-child{animation:rise .45s var(--ease) both}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.confetti i{position:absolute;top:0;left:0;border-radius:3px;will-change:transform,opacity}
.breath{display:flex;flex-direction:column;align-items:center;gap:12px;padding:10px 0 4px}
#brcircle{width:120px;height:120px;border-radius:50%;background:var(--accent);opacity:.85;transform:scale(.6);transition:transform 4s ease-in-out}
.hot a{display:inline-block;margin:6px 6px 0 0;padding:8px 12px;border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;background:var(--bg)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;transition-duration:.001ms!important}}
button,textarea{font-family:inherit}
#onb{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.obc{width:100%;max-width:400px}.obc label{display:block;margin-bottom:14px}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sw{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}.sw i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.cols input{height:42px;padding:3px}
.buddies{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px}
.bcard{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:4px;transition:transform .15s}
.bcard:active{transform:scale(.97)}.bcard small{color:var(--muted)}
.bud{width:58px;height:58px;overflow:visible;animation:bob 3.4s ease-in-out infinite}
.bud .bd{fill:color-mix(in srgb,var(--bc) 24%,var(--card));stroke:var(--bc);stroke-width:2}
.bud .ey{fill:var(--ink);transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.bud .ey.b{animation-delay:.04s}
.bud .mo{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.bud .ac{fill:var(--bc)}.bud .ck{fill:var(--bc);opacity:.35}
.bud .wv{fill:color-mix(in srgb,var(--bc) 24%,var(--card));stroke:var(--bc);stroke-width:2;transform-origin:49px 44px;animation:wave 3s ease-in-out infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes wave{0%,55%,100%{transform:rotate(0)}65%{transform:rotate(-24deg)}75%{transform:rotate(8deg)}85%{transform:rotate(-20deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){.bud,.bud .ey,.bud .wv{animation:none!important}}
.kate{display:flex;align-items:center;gap:12px;position:relative;background:color-mix(in srgb,#d9667a 12%,var(--card));border:1px solid color-mix(in srgb,#d9667a 35%,var(--line));border-radius:14px;padding:14px;margin-bottom:14px}
.kate p{margin:0;line-height:1.4}
.kh{flex:none;width:38px;height:38px;padding:0;background:none;border:0;cursor:pointer;color:#d9667a;display:grid;place-items:center}
.kh svg{width:34px;height:34px;fill:currentColor;animation:khb 2.6s ease-in-out infinite}
.kh.pop svg{animation:khp .7s cubic-bezier(.3,1.6,.5,1)}
.kf{position:absolute;left:30px;top:22px;color:#d9667a;font-size:14px;pointer-events:none;opacity:0;animation:kfl 1.5s ease-out forwards}
@keyframes khb{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
@keyframes khp{0%{transform:scale(1)}35%{transform:scale(1.45) rotate(-8deg)}70%{transform:scale(.92) rotate(4deg)}100%{transform:scale(1)}}
@keyframes kfl{0%{opacity:0;transform:translate(0,0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-70px) scale(1.1)}}
@media (prefers-reduced-motion:reduce){.kh svg,.kh.pop svg,.kf{animation:none!important}}
nav{display:none!important}
.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:24px 0 8px}
.nx{background:color-mix(in srgb,var(--accent) 12%,var(--card));margin:0 0 10px}
.hg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ht{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:500;font-size:13px;min-width:0}
.ht small{color:var(--muted);font-weight:400;font-size:11px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ht svg{width:26px;height:26px;fill:none;stroke:var(--accent);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ht:active{transform:scale(.97)}
.cdc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.cdt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}.cdt span{font-weight:600}.cdt small{color:var(--muted)}
.tm{display:flex;align-items:flex-start;justify-content:center;gap:4px;font-family:ui-monospace,"SF Mono","Roboto Mono","Courier New",monospace;color:var(--cd,var(--accent))}
.tm .sg{display:flex;flex-direction:column;align-items:center;background:color-mix(in srgb,var(--cd,var(--accent)) 10%,var(--card));border:1px solid color-mix(in srgb,var(--cd,var(--accent)) 28%,var(--line));border-radius:10px;padding:8px 6px 5px;min-width:56px}
.tm b{font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:1px;text-shadow:0 0 12px color-mix(in srgb,var(--cd,var(--accent)) 45%,transparent)}
.tm small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.tm i{font-style:normal;font-size:26px;font-weight:700;line-height:1.35;animation:cdb 1s steps(1) infinite}
@keyframes cdb{50%{opacity:.25}}
@media (max-width:360px){.tm b{font-size:24px}.tm .sg{min-width:46px}}
@media (prefers-reduced-motion:reduce){.tm i{animation:none}}
.bud .zz{display:none;font-size:12px;font-weight:700;fill:var(--bc)}
.bud.sleepy .zz{display:block;animation:zz 2.6s ease-in-out infinite}
.bud.sleepy .ey{animation:none;transform:scaleY(.15)}.bud.sleepy .wv{animation:none}
@keyframes zz{0%{opacity:0;transform:translateY(6px)}50%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.bud.sleepy .zz{animation:none}}

/* ---------- APP ICON PICKER ---------- */
.icongrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 12px}
.iconpick{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:10px 6px 8px;font-size:12px;font-weight:600;box-shadow:none}
.iconpick img{display:block;width:46px;height:46px;border-radius:12px}
.iconpick.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 32%,transparent)}
.iconprev{display:flex;justify-content:center;margin:2px 0 12px}
.iconprev img{display:block;width:88px;height:88px;border-radius:22px;box-shadow:0 10px 20px -12px rgba(0,0,0,.55);transition:transform .3s var(--ease)}

/* ---------- CHAT INPUT ROWS (Ask / Send) ---------- */
.chatIn{display:flex;align-items:center;gap:8px;margin-bottom:18px}
.chatIn.tight{margin-bottom:12px}
.chatIn.top{margin-top:10px;margin-bottom:0}
.chatIn input{flex:1;min-width:0;height:46px;margin:0;padding:0 14px;line-height:1.2}
.chatIn button{flex:none;height:46px;min-height:46px;margin:0;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;line-height:1}
@media (max-width:360px){.chatIn button{padding:0 12px}}

/* ---------- MOOD BUTTONS: state changes in place ---------- */
.card [data-hmood]{transition:background-color .25s var(--ease),color .25s var(--ease),border-color .25s var(--ease)}
.card [data-hmood].on{background:var(--accent);color:var(--on);border-color:var(--accent)}
.moodc{padding:14px 12px 10px}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.mood{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:9px 2px 7px;min-height:64px;border-radius:12px;background:var(--bg);border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:10.5px;line-height:1.2;box-shadow:none}
.mood .mi{display:block;width:27px;height:27px;color:var(--mc,var(--accent));transition:color .25s var(--ease),transform .32s var(--spring)}
.mood .mi svg{display:block;width:100%;height:100%;overflow:visible}
.mood .mi svg *{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mood .mi .fhd{fill:currentColor;stroke:none;opacity:.13}
.mood .mi .fe{fill:currentColor;stroke:none}
.mood .mi .fb{fill:currentColor;stroke:none;opacity:.36}
.mood .mi .ftear{fill:currentColor;stroke:none;opacity:.42}
.mood .mi .fsp{fill:currentColor;stroke:none;opacity:.6}
.mood:nth-child(1){--mc:#e0857f}
.mood:nth-child(2){--mc:#dfa76b}
.mood:nth-child(3){--mc:#87aec9}
.mood:nth-child(4){--mc:#76bfa0}
.mood:nth-child(5){--mc:#ae95dd}
.mood:hover .mi{transform:scale(1.06)}
.mood.on .mi{color:var(--on);transform:scale(1.08)}
.mood.on{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.mweek{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;align-items:end;margin-top:14px}
.mday{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;padding:6px 0 4px;border-radius:9px;transition:background-color .25s var(--ease)}
.mday .mbar{display:block;width:100%;max-width:20px;border-radius:4px;transition:height .35s var(--ease),background-color .35s var(--ease),opacity .35s var(--ease)}
.mday small{font-size:10px;letter-spacing:.01em;color:var(--muted);font-weight:600}
.mday.today{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.mday.today small{color:var(--accent);font-weight:800}

/* ---------- STABLE TAB BAR + QUICK-ADD ---------- */
nav{flex:none;height:56px;align-items:stretch;box-sizing:border-box;padding:0}
nav button{box-sizing:border-box;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 2px;border:0;border-radius:0;line-height:1.15}

/* ---------- Group Study tile, More tiles, Custom Layout, voice room ---------- */
.gtile{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:15px;margin:0 0 2px;font-weight:400}
.gtile .gico{flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 12%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line))}
.gtile .gico svg{width:24px;height:24px;fill:none;stroke:var(--accent);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.gtile .gt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.gtile .gt b{font-size:16px;font-weight:650;letter-spacing:-.2px}
.gtile .gt small{color:var(--muted);font-size:12.5px}
.gbadge{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));border-radius:999px;padding:4px 9px;white-space:nowrap}
.gbadge i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.mtiles{display:grid;gap:10px;margin-bottom:8px}
.mtile{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px;font-weight:400}
.mtile .mi{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line)}
.mtile .mi svg{width:19px;height:19px;fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mtile .mt{flex:1;min-width:0}
.mtile .mt b{display:block;font-size:15px;font-weight:600}
.mtile .mt small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mtile .mgo{color:var(--muted);font-size:18px;line-height:1}
.hllist{display:grid;gap:8px}
.hlrow{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.hlrow .hl{flex:1;min-width:0}
.hlrow .hl b{display:block;font-size:14px;font-weight:600}
.hlrow .hl small{display:block;color:var(--muted);font-size:12px}
.hlrow button{background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:6px 9px;border-radius:9px;font-weight:600;min-width:0}
.hlrow button.ond{background:var(--accent);color:var(--on);border-color:var(--accent)}
.hlrow.locked{background:var(--bg)}
#gsroom{position:fixed;inset:0;z-index:70;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.gshe{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.gshe h1{font-size:22px;margin:0}

/* daily motivational note */
.sn{--paper:#fdf8e7;--paper2:#f7efd7;--inkp:#4b4227;--linep:#e6d9b4;position:relative;display:flex;flex-direction:column;justify-content:space-between;z-index:900;width:118px;height:118px;aspect-ratio:1/1;max-width:100%;margin:10px 0 14px;padding:18px 10px 8px;text-align:left;border-radius:4px 12px 12px 12px;border:1px solid var(--linep);color:var(--inkp);background-color:var(--paper);background-image:linear-gradient(160deg,rgba(255,255,255,.5),rgba(255,255,255,0) 62%),repeating-linear-gradient(180deg,transparent 0 22px,rgba(150,130,70,.08) 22px 23px);box-shadow:0 7px 18px rgba(74,62,26,.14),0 1px 0 rgba(255,255,255,.7) inset;transform:rotate(-1.2deg);transition:transform .3s var(--ease),box-shadow .3s var(--ease),opacity .3s var(--ease);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}

.sn .snsig,.snzcard .snsig{display:block;margin:9px 0 0;font-size:11.5px;font-weight:700;letter-spacing:.04em;opacity:.66;text-align:right}

#sntrash{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));width:62px;height:62px;margin-left:-31px;display:grid;place-items:center;border-radius:50%;background:var(--card);border:1px solid var(--line);box-shadow:0 12px 30px rgba(20,30,24,.18);z-index:950;opacity:0;transform:translateY(150%) scale(.9);transition:transform .3s var(--ease),opacity .25s var(--ease),background-color .2s,border-color .2s;pointer-events:none}

/* custom layout editor */

/* ---------- Floating Home note layer (fixed, above every Home card) ---------- */

/* ---------- Journal sticky note zoom ---------- */

/* ---------- Draggable Quick Add (+) ---------- */
#qa{position:fixed;z-index:930;width:54px;height:54px;min-height:54px;padding:0;border-radius:18px;display:grid;place-items:center;background:linear-gradient(152deg,color-mix(in srgb,var(--accent) 52%,#fff),color-mix(in srgb,var(--accent) 90%,#000));color:var(--on);border:1px solid color-mix(in srgb,var(--accent) 28%,#fff);box-shadow:0 14px 28px -12px color-mix(in srgb,var(--accent) 70%,transparent),0 2px 6px rgba(8,18,13,.16),inset 0 1px 0 rgba(255,255,255,.45);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;transition:transform .22s var(--spring),box-shadow .28s var(--ease),opacity .22s var(--ease)}

#qamenu.on{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}

window.ssBackup=function(){try{var raw=localStorage.getItem('studyspace1')||'{}';var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([raw],{type:'application/json'}));a.download='studyspace-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove()}catch(e){}};
window.ssReload=function(){try{if(navigator.serviceWorker)navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){x.unregister()})});if(window.caches)caches.keys().then(function(k){k.forEach(function(c){if(c.indexOf('studyspace-')===0)caches.delete(c)})})}catch(e){}setTimeout(function(){location.href=location.pathname+'?fresh='+Date.now()},400)};
function ssFail(msg,line){
  if(!window.__booted){
    var v=document.getElementById('view');
    if(v){v.innerHTML='<div class="card"><h2>The app could not start</h2><p><small>'+String(msg).replace(/[<>&]/g,' ')+(line?' (Line '+line+')':'')+'</small></p><p><small>Your data has not been touched.</small></p><div class="two"><button onclick="ssReload()">Reload app</button><button class="ghost" onclick="ssBackup()">Download my data</button></div></div>';return}
  }
  var b=document.getElementById('errbn');
  if(!b){b=document.createElement('div');b.id='errbn';b.className='banner';b.setAttribute('role','alert');b.onclick=function(){b.remove()};document.body.appendChild(b)}
  b.textContent='Something went wrong ('+String(msg).slice(0,80)+'). Your data is safe. Tap to dismiss.';
}
window.addEventListener('error',function(e){ssFail(e.message||'Unknown error',e.lineno)});
window.addEventListener('unhandledrejection',function(e){ssFail((e.reason&&e.reason.message)||'A request failed')});

<script>
const COLORS=['#3d7a5a','#c0793b','#5b7fb5','#a45a7c','#8a8f3a'];
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const AI_WORKER_URL='https://studyspace-ai.jasper-esclamado02.workers.dev';
/* In the installed Android app, send AI requests through Capacitor's native HTTP.
   In a normal browser (or if native is missing) it uses plain fetch. */
async function aiFetch(url,opts){
  opts=opts||{};
  const C=window.Capacitor,H=C&&C.Plugins&&C.Plugins.CapacitorHttp;
  const native=!!(H&&C.isNativePlatform&&C.isNativePlatform());
  if(!native)return fetch(url,opts);
  const sig=opts.signal;
  const abortErr=()=>{try{return new DOMException('Aborted','AbortError')}catch(e){const x=new Error('Aborted');x.name='AbortError';return x}};
  if(sig&&sig.aborted)throw abortErr();
  try{
    let data;
    if(opts.body){try{data=JSON.parse(opts.body)}catch(e){data=opts.body}}
    const req=H.request({url:url,method:opts.method||'GET',headers:opts.headers||{},data:data,connectTimeout:30000,readTimeout:120000}).then(function(r){
      return new Response(typeof r.data==='string'?r.data:JSON.stringify(r.data),{status:r.status,headers:{'Content-Type':'application/json'}});
    });
    if(!sig)return await req;
    return await new Promise(function(ok,no){
      sig.addEventListener('abort',function(){no(abortErr())});
      req.then(ok,no);
    });
  }catch(e){
    if(e&&e.name==='AbortError')throw e;
    return fetch(url,opts);
  }
}
const MAX_AI_MB=10;
const MAX_AI_BYTES=MAX_AI_MB*1024*1024;
const MAX_AI_DAILY=2;
const MAX_BUDDY_DAILY=30;
const MAX_LIFE_DAILY=40;
const MAX_ACCT_DAILY=40;
let DEVID='';try{DEVID=localStorage.getItem('studyspace-dev')||'';if(!DEVID){DEVID=(Date.now().toString(36)+Math.random().toString(36).slice(2,10)).slice(0,24);localStorage.setItem('studyspace-dev',DEVID)}}catch(e){}

const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayStr=()=>ymd(new Date());

// Universal sentence splitter (no lookbehind regex so older mobile WebViews never crash)
function splitSents(t){
  return String(t||'').replace(/([.!?])\s+/g,'$1\n').split(/\n+/).map(x=>x.trim()).filter(Boolean);
}

const blank=()=>({
  subjects:[],tasks:[],sessions:[],exams:[],notes:[],decks:[],res:[],reviews:[],grades:{},
  wallet:{tx:[],avail:0,goals:[]},journal:{},habits:[],sleep:{bed:'22:30',wake:'06:00'},
  theme:'',alerts:false,lead:10,fired:{},
  ai:{date:todayStr(),used:0,onlineUsed:0,offlineUsed:0,acctUsed:0,mode:'online'},
  lb:{date:todayStr(),used:0,noted:false},
  wg:{on:false,size:'medium',exam:''},
  wgs:{size:'medium',note:''},
  icon:{style:'style1',theme:'default'},
  home:{order:[],hidden:[]},
  stickies:[],quick:{x:null,y:null},
  spin:{id:'',x:null,y:null,min:false,side:'',py:null},
  note:{date:'',text:'',x:null,y:null,dismissed:false,src:'',min:false,side:'',py:null},
  prof:{name:'',age:'',level:'',done:false},ui:{}
});

function load(){
  let d=blank();
  try{
    const raw=JSON.parse(localStorage.getItem('studyspace1')||'{}');
    if(raw&&typeof raw==='object')d=Object.assign(d,raw);
  }catch(e){}
  ['subjects','tasks','sessions','exams','notes','decks','res','reviews','habits'].forEach(k=>{
    if(!Array.isArray(d[k]))d[k]=[];
  });
  if(!d.grades||typeof d.grades!=='object')d.grades={};
  if(!d.journal||typeof d.journal!=='object')d.journal={};
  if(!d.fired||typeof d.fired!=='object')d.fired={};
  if(!d.sleep||typeof d.sleep!=='object')d.sleep={bed:'22:30',wake:'06:00'};
  if(!d.wallet||typeof d.wallet!=='object')d.wallet={tx:[],avail:0,goals:[]};
  if(!Array.isArray(d.wallet.goals))d.wallet.goals=[];
  if(!Array.isArray(d.wallet.tx))d.wallet.tx=[];
  if(typeof d.wallet.avail!=='number')d.wallet.avail=Number(d.wallet.budget)||0;
  d.wallet.tx=d.wallet.tx.filter(t=>t&&t.type==='out');
  d.subjects.forEach(s=>{if(s)s.classes=Array.isArray(s.classes)?s.classes:[]});
  d.tasks.forEach(t=>{if(t)t.time=t.time||'23:59'});
  d.habits.forEach(h=>{if(h&&(!h.days||typeof h.days!=='object'))h.days={}});
  if(!d.ai||typeof d.ai!=='object')d.ai={date:todayStr(),used:0,onlineUsed:0,offlineUsed:0,acctUsed:0,mode:'online'};
  delete d.ai.key;
  if(d.ai.date!==todayStr()){
    d.ai.date=todayStr();
    d.ai.used=0;
    d.ai.onlineUsed=0;
    d.ai.offlineUsed=0;
    d.ai.acctUsed=0;
  }
  if(!d.ai.mode)d.ai.mode='online';
  if(!d.lb||typeof d.lb!=='object')d.lb={date:todayStr(),used:0,noted:false};
  if(d.lb.date!==todayStr()){d.lb.date=todayStr();d.lb.used=0}
  if(!d.wg||typeof d.wg!=='object')d.wg={on:false,size:'medium',exam:''};
  if(d.wg.size!=='small'&&d.wg.size!=='large')d.wg.size='medium';
  if(typeof d.wg.exam!=='string')d.wg.exam='';
  d.wg.on=!!d.wg.on;
  if(!d.icon||typeof d.icon!=='object')d.icon={style:'style1',theme:'default'};
  if(d.icon.style!=='style1'&&d.icon.style!=='style2')d.icon.style='style1';
  if(!/^(default|theme[1-5])$/.test(String(d.icon.theme||'')))d.icon.theme='default';
  if(!d.home||typeof d.home!=='object')d.home={order:[],hidden:[]};
  if(!Array.isArray(d.home.order))d.home.order=[];
  if(!Array.isArray(d.home.hidden))d.home.hidden=[];
  if(!d.note||typeof d.note!=='object')d.note={date:'',text:'',x:null,y:null,dismissed:false,src:''};
  if(typeof d.note.text!=='string')d.note.text='';
  if(typeof d.note.date!=='string')d.note.date='';
  d.note.dismissed=!!d.note.dismissed;
  d.note.min=!!d.note.min;
  if(d.note.side!=='left'&&d.note.side!=='right')d.note.side='';
  if(typeof d.note.py!=='number')d.note.py=null;
  if(!Array.isArray(d.stickies))d.stickies=[];
  d.stickies=d.stickies.filter(function(x){return x&&typeof x==='object'});
  d.stickies.forEach(function(x){
    if(!x.id)x.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    x.text=String(x.text||'').slice(0,400);
    if(['yellow','pink','blue','mint','lavender'].indexOf(x.color)<0)x.color='yellow';
    x.expires=Number(x.expires)||0;x.created=Number(x.created)||Date.now();
  });
  var STK_NOW=Date.now();
  d.stickies=d.stickies.filter(function(x){return !x.expires||x.expires>STK_NOW});
  if(!d.wgs||typeof d.wgs!=='object')d.wgs={size:'medium',note:''};
  if(['small','medium','large'].indexOf(d.wgs.size)<0)d.wgs.size='medium';
  if(typeof d.wgs.note!=='string')d.wgs.note='';
  if(!d.quick||typeof d.quick!=='object')d.quick={x:null,y:null};
  if(typeof d.quick.x!=='number')d.quick.x=null;
  if(typeof d.quick.y!=='number')d.quick.y=null;
  if(!d.spin||typeof d.spin!=='object')d.spin={id:'',x:null,y:null,min:false,side:'',py:null};
  if(typeof d.spin.id!=='string')d.spin.id='';
  if(typeof d.spin.x!=='number')d.spin.x=null;
  if(typeof d.spin.y!=='number')d.spin.y=null;
  d.spin.min=!!d.spin.min;
  if(d.spin.side!=='left'&&d.spin.side!=='right')d.spin.side='';
  if(typeof d.spin.py!=='number')d.spin.py=null;
  Object.keys(d.fired).forEach(k=>{if(d.fired[k]===1)d.fired[k]=Date.now()});
  return d;
}

let S=load();
function save(){try{localStorage.setItem('studyspace1',JSON.stringify(S))}catch(e){}
  /* Keep the Android home screen widget in step with every change. */
  try{wgSyncSoon()}catch(e){}}
function checkAiDay(){
  if(S.ai.date!==todayStr()){
    S.ai.date=todayStr();S.ai.used=0;S.ai.onlineUsed=0;S.ai.offlineUsed=0;S.ai.acctUsed=0;save();
  }
}
function aiLeft(){checkAiDay();return Math.max(0,MAX_AI_DAILY-(S.ai.used||0))}
function buddyOnlineLeft(){checkAiDay();return Math.max(0,MAX_BUDDY_DAILY-(S.ai.onlineUsed||0))}
function buddyOfflineLeft(){checkAiDay();return Math.max(0,MAX_BUDDY_DAILY-(S.ai.offlineUsed||0))}
function acctLeft(){checkAiDay();return Math.max(0,MAX_ACCT_DAILY-(S.ai.acctUsed||0))}

function iconState(){

/* Aliases are style_theme; style1_default is the icon the app ships with. */
function iconAlias(style,theme){return(style==='style1'&&theme==='default')?'default':style+'_'+theme}
function iconNative(){
  try{var C=window.Capacitor;return !!(C&&C.isNativePlatform&&C.isNativePlatform()&&((C.Plugins&&C.Plugins.AppIcon)||window.StudySpaceIcon))}catch(e){return false}
}
function iconSet(name){
  /* Alias names are style_theme; style1_default is the shipped icon. */

}

/* Both buddies are asleep inside the sleep window set in Life Tracker. */
function sleepTime(){
  try{
    const sl=S&&S.sleep,b=sl&&sl.bed,w=sl&&sl.wake;
    if(b&&w&&b!==w){
      const d=new Date(),m=d.getHours()*60+d.getMinutes();
      const bm=Number(b.slice(0,2))*60+Number(b.slice(3)),wm=Number(w.slice(0,2))*60+Number(w.slice(3));
      return bm>wm?(m>=bm||m<wm):(m>=bm&&m<wm);
    }
  }catch(e){}
  const h=new Date().getHours();return h>=22||h<5;
}
window.sleepTime=sleepTime;

function snBind(){
  const find=function(e){return e.target&&e.target.closest?e.target.closest('#sn,#sns'):null};

    document.addEventListener('pointerdown',function(e){
      const el=find(e);

      if(e.pointerType==='mouse'&&e.button!==0)return;
      snDown(el,e,e);
    },{passive:false});
    document.addEventListener('pointermove',function(e){if(SNG)snMove(e,e)},{passive:false});
    document.addEventListener('pointerup',function(){snUp()});

  }else{

      const el=find(e);

    document.addEventListener('touchend',function(){snUp()});

  document.addEventListener('click',function(e){
    const b=e.target.closest&&e.target.closest('[data-snmin]');
    if(!b)return;
    e.preventDefault();e.stopPropagation();
    const stk=b.getAttribute('data-snmin')==='stk';

    const r=el.getBoundingClientRect(),v=snViewport(),n=stk?spinState():noteState();

    if(e.key==='Escape'){if(document.getElementById('snz'))snUnfocus();else if(document.getElementById('skz'))skZoomClose();return}

/* MOTION */
const REDUCE=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
let _mk='';
function motionAfterRender(){
  try{
    const nav=document.querySelector('nav');
    if(nav){
      let ind=$('#navind');
      if(!ind){ind=document.createElement('i');ind.id='navind';nav.appendChild(ind)}
      const bs=[...nav.querySelectorAll('button')],i=Math.max(0,bs.findIndex(b=>b.dataset.t===tab));
      const first=!ind.dataset.ready;
      if(first)ind.style.transition='none';
      ind.style.width=(100/bs.length)+'%';ind.style.transform='translateX('+(i*100)+'%)';
      if(first){void ind.offsetWidth;ind.style.transition='';ind.dataset.ready='1'}
    }
    const key=[tab,typeof hv!=='undefined'?hv:'',typeof curSub!=='undefined'?curSub:'',typeof L!=='undefined'&&L?L.k+':'+L.i:'',typeof B!=='undefined'?B.mode+':'+B.i:'',typeof ACCT!=='undefined'?ACCT.tab:''].join('|');
    if(key===_mk)return;
    _mk=key;
    if(REDUCE)return;
    const v=$('#view');
    [...v.children].slice(0,14).forEach((el,i)=>{el.style.setProperty('--i',i);el.classList.add('rise')});
    v.querySelectorAll('.bar i').forEach(el=>{
      const w=el.style.width;if(!w)return;
      el.style.transition='none';el.style.width='0%';void el.offsetWidth;el.style.transition='';
      requestAnimationFrame(()=>{el.style.width=w});
    });
    v.querySelectorAll('.stats b').forEach(el=>{
      if(!/^\d+$/.test(el.textContent))return;
      const n=+el.textContent;if(n<1)return;
      const t0=performance.now();
      const step=t=>{const p=Math.min(1,(t-t0)/800),e=1-Math.pow(1-p,3);el.textContent=Math.round(n*e);if(p<1)requestAnimationFrame(step)};
      requestAnimationFrame(step);
    });
  }catch(e){}
}
function celebrate(){
  if(REDUCE)return;
  try{
    const box=document.createElement('div');box.className='confetti';document.body.appendChild(box);
    const cols=['#3d7a5a','#c0793b','#5b7fb5','#a45a7c','#8a8f3a','#e6c35c'];
    const W=innerWidth,H=innerHeight,cx=W/2,cy=H*0.38;
    for(let i=0;i<34;i++){
      const p=document.createElement('i'),sz=6+Math.random()*7;
      p.style.cssText='width:'+sz+'px;height:'+(sz*0.6)+'px;background:'+cols[i%cols.length];
      box.appendChild(p);
      const ang=Math.random()*Math.PI*2,dist=90+Math.random()*(W*0.38),dx=Math.cos(ang)*dist,dy=Math.sin(ang)*dist*0.7-60;
      p.animate([
        {transform:'translate('+cx+'px,'+cy+'px) rotate(0deg) scale(.4)',opacity:0},

/* STUDYBUDDY DUAL ONLINE / INSTANT OFFLINE AI */
let B={mode:'',cards:[],i:0,show:false,picked:null,ok:0,miss:[],sum:null,nid:'',text:'',chat:[],q:'',busy:false};

const bsrc=()=>{const el=$('#btext');const t=el?el.value.trim():B.text.trim();if(t)return t;const n=S.notes.find(x=>x.id===($('#bnote')?$('#bnote').value:B.nid));return n?n.body:''};
function summarize(t,n){n=n||4;const ss=splitSents(t).filter(x=>x.length>20);if(ss.length<=n)return ss;
const stop=new Set('the and that with this from have for are was were which their there about into when what your you can not but'.split(' ')),f={};
(t.toLowerCase().match(/[a-z]{4,}/g)||[]).forEach(w=>{if(!stop.has(w))f[w]=(f[w]||0)+1});
return ss.map((x,i)=>({i,x,s:(x.toLowerCase().match(/[a-z]{4,}/g)||[]).reduce((a,w)=>a+(f[w]||0),0)/Math.sqrt(x.length)})).sort((a,b)=>b.s-a.s).slice(0,n).sort((a,b)=>a.i-b.i).map(o=>o.x)}
function makeCards(t){const c=[];String(t||'').split(/\n+/).forEach(l=>{if(l.length>220)return;const m=l.match(/^\s*[-•*\d.)\s]*(.{2,60}?)\s*(?::|=| - | – | — )\s*(.{3,})$/);if(m)c.push({q:m[1].trim(),a:m[2].trim()})});return c}

function offlineSmartAnswer(q,ctx){
  const allText=(ctx?ctx+'\n':'')+S.notes.map(n=>noteTitle(n)+': '+n.body).join('\n');
  if(!allText.trim())return'Paste some text or select a note below first so I can answer your questions offline!';
  const ql=q.toLowerCase();
  if(ql.includes('summar')||ql.includes('key point')||ql.includes('main idea')){
    const pts=summarize(ctx||allText,5);
    return pts.length?'Key Summary Points:\n• '+pts.join('\n• '):'Not enough text to summarize yet.';
  }
  if(ql.includes('quiz')||ql.includes('question')||ql.includes('test me')||ql.includes('flashcard')){
    const cds=buildCards(ctx||allText).slice(0,5);
    return cds.length?'Practice Questions:\n'+cds.map((c,i)=>(i+1)+'. '+c.q+'\n   Ans: '+c.a).join('\n\n'):'Try adding a longer note to generate practice questions.';
  }
  const words=(ql.match(/[a-z0-9]{3,}/g)||[]).filter(w=>!['what','when','where','which','explain','tell','about','from','does','mean','define','how','why','who'].includes(w));
  const sents=splitSents(allText).filter(s=>s.length>12);
  if(!words.length)return'Key points from your notes:\n• '+summarize(allText,4).join('\n• ');
  const scored=sents.map(s=>{
    const low=s.toLowerCase();
    let sc=0;words.forEach(w=>{if(low.includes(w))sc+=(low.indexOf(w)===0?4:2)});
    return {s,sc};
  }).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,4);
  if(scored.length)return'Here is what your notes say:\n• '+scored.map(x=>x.s).join('\n• ');
  return'No exact match for "'+q+'" in your current notes. Top points from your study text:\n• '+summarize(allText,3).join('\n• ');
}

async function askStudyBuddy(){
  const inp=$('#bask');
  const q=(inp?inp.value:B.q).trim();
  if(!q||B.busy)return;
  const ctx=bsrc();
  if($('#bnote'))B.nid=$('#bnote').value;
  if($('#btext'))B.text=$('#btext').value;
  const mode=S.ai.mode||'online';
  if(mode==='device'){await askDevice(q,ctx);return}

  if(mode==='online'){
    if(buddyOnlineLeft()<=0){banner('Daily Online AI limit reached ('+MAX_BUDDY_DAILY+'/'+MAX_BUDDY_DAILY+'). Switch to Offline Mode!');return;}
    B.chat.push({role:'u',text:q});
    B.q='';B.busy=true;render();
    try{
      const notesCtx=ctx||S.notes.slice(0,5).map(n=>noteTitle(n)+': '+n.body).join('\n\n');
      const ctrl=new AbortController();
      const tid=setTimeout(()=>ctrl.abort(),50000);
      const res=await aiFetch(AI_WORKER_URL,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({mode:'chat',question:q,context:notesCtx,device:DEVID,analysis:(B.vision&&B.vision.text)||'',history:B.chat.slice(-9,-1).map(function(m){return{role:m.role==='u'?'user':'model',text:m.text}})}),
        signal:ctrl.signal
      });
      clearTimeout(tid);
      if(!res.ok){
        const errData=await res.json().catch(()=>({}));
        throw new Error((errData.error&&errData.error.message)||('Server Error '+res.status));
      }
      const data=await res.json();
      const parts=(data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts)||[];
      const textPart=parts.find(p=>p.text&&!p.thought)||parts[0];
      const reply=(textPart&&textPart.text)||'No response generated.';
      S.ai.onlineUsed=(S.ai.onlineUsed||0)+1;save();
      B.chat.push({role:'a',text:reply});
    }catch(e){
      const msg=e.name==='AbortError'?'Request timed out. Switched to instant Offline answer:\n\n'+offlineSmartAnswer(q,ctx):'Online AI notice ('+e.message+'). Instant Offline answer:\n\n'+offlineSmartAnswer(q,ctx);
      B.chat.push({role:'a',text:msg});
    }
    B.busy=false;render();
  }else{
    if(buddyOfflineLeft()<=0){banner('Daily Offline AI limit reached ('+MAX_BUDDY_DAILY+'/'+MAX_BUDDY_DAILY+'). Try again tomorrow!');return;}
    B.chat.push({role:'u',text:q});
    B.q='';
    const reply=offlineSmartAnswer(q,ctx);
    S.ai.offlineUsed=(S.ai.offlineUsed||0)+1;save();
    B.chat.push({role:'a',text:reply});
    render();
  }
}

/* ON-DEVICE AI (WebLLM) */
const WEBLLM_URL='https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.79/+esm';
const DEVMODELS={
  tiny:{label:'Tiny: fastest, simple answers',pre:'SmolLM2-360M-Instruct-',mb:'about 200 MB'},
  small:{label:'Small: recommended',pre:'Qwen2.5-0.5B-Instruct-',mb:'about 400 MB'},
  med:{label:'Medium: smarter but slower',pre:'Qwen2.5-1.5B-Instruct-',mb:'about 1 GB'}
};
const DEV={state:'idle',pct:0,msg:'',id:'',check:''};
let WL=null,ENG=null,AITEST='';
async function wlib(){if(!WL)WL=await import(WEBLLM_URL);return WL}
async function pickModelId(key){
  const w=await wlib();
  const ids=w.prebuiltAppConfig.model_list.map(m=>m.model_id);
  const pre=(DEVMODELS[key]||DEVMODELS.small).pre;
  let f16=false;
  try{const ad=await navigator.gpu.requestAdapter();f16=!!(ad&&ad.features.has('shader-f16'))}catch(e){}
  const c=ids.filter(i=>i.startsWith(pre));
  const id=c.find(i=>i.includes(f16?'q4f16_1':'q4f32_1'))||c.find(i=>i.includes('q4'))||c[0];
  if(!id)throw new Error('That model is not available in this version of the AI engine.');
  return id;
}
function updDev(){const b=$('#devbar'),m=$('#devmsg');if(b)b.style.width=DEV.pct+'%';if(m)m.textContent=DEV.msg}
function devErr(e){
  const m=String((e&&e.message)||e);
  if(/memory|OOM|lost/i.test(m))return 'The phone ran out of memory. Close other apps or pick a smaller model.';
  if(/fetch|network|load failed/i.test(m))return 'The download failed. Check your wifi and try again. It continues where it stopped.';
  return m;
}
async function devLoad(){
  if(DEV.state==='loading'||DEV.state==='ready')return;
  if(!navigator.gpu){DEV.state='error';DEV.msg='This browser has no WebGPU, so on-device AI cannot run here. Use Instant or Online mode.';render();return}
  DEV.state='loading';DEV.pct=0;DEV.msg='Starting...';render();
  try{
    const w=await wlib();
    const id=await pickModelId(S.ai.dev||'small');
    DEV.id=id;
    ENG=await w.CreateMLCEngine(id,{initProgressCallback:p=>{DEV.pct=Math.round((p.progress||0)*100);DEV.msg=p.text||'';updDev()}});
    DEV.state='ready';S.ai.devCached=S.ai.dev||'small';save();
  }catch(e){ENG=null;DEV.state='error';DEV.msg=devErr(e)}
  render();
}
async function devCheckPhone(){
  DEV.check='Checking...';render();
  try{
    if(!navigator.gpu)DEV.check='No WebGPU in this browser. On-device AI will not run here.';
    else{const ad=await navigator.gpu.requestAdapter();
      DEV.check=!ad?'WebGPU exists but no GPU was found.':'WebGPU works. '+(ad.features.has('shader-f16')?'Fast 16-bit mode is supported.':'16-bit mode is not supported, so the slower 32-bit model will be used.')}
  }catch(e){DEV.check='Check failed: '+e.message}
  render();
}
function devCard(){
  const key=S.ai.dev||'small',m=DEVMODELS[key];
  if(DEV.state==='ready')return'<div class="card" style="margin-bottom:12px"><b>On-device model ready</b><br><small>'+esc(DEV.id)+'. Runs on your phone with no internet. Free and unlimited.</small><div style="display:flex;gap:8px;margin-top:10px"><button class="ghost" id="devunload" style="flex:1">Unload</button><button class="ghost" id="devdelete" style="flex:1">Delete download</button></div></div>';
  if(DEV.state==='loading')return'<div class="card" style="margin-bottom:12px"><b>'+(S.ai.devCached===key?'Loading model...':'Downloading model...')+'</b><div class="bar"><i id="devbar" style="width:'+DEV.pct+'%"></i></div><small id="devmsg">'+esc(DEV.msg)+'</small></div>';
  return'<div class="card" style="margin-bottom:12px"><label>Model size<select id="devsize">'+Object.entries(DEVMODELS).map(([k,v])=>'<option value="'+k+'"'+(key===k?' selected':'')+'>'+v.label+'</option>').join('')+'</select></label>'+
  (DEV.state==='error'?'<p class="late" style="margin:8px 0 0">'+esc(DEV.msg)+'</p>':'')+
  '<div style="display:flex;gap:8px;margin-top:10px"><button id="devload" style="flex:1">'+(S.ai.devCached===key?'Load model':'Download model')+'</button><button class="ghost" id="devcheck" style="flex:1">Check my phone</button></div>'+
  '<small>The first download needs wifi ('+m.mb+'). After that it works offline.</small>'+(DEV.check?'<p style="margin:8px 0 0">'+esc(DEV.check)+'</p>':'')+'</div>';
}
function pickContext(q,ctx,max){
  const words=(q.toLowerCase().match(/[a-z0-9]{3,}/g)||[]);
  const ss=splitSents(ctx).map((x,i)=>({i,x,sc:words.reduce((a,w)=>a+(x.toLowerCase().includes(w)?1:0),0)}));
  const keep=ss.slice().sort((a,b)=>b.sc-a.sc||a.i-b.i);
  let n=0;const pick=[];
  for(const o of keep){if(n+o.x.length>max)continue;pick.push(o);n+=o.x.length;if(n>=max)break}
  return pick.sort((a,b)=>a.i-b.i).map(o=>o.x).join(' ');
}
async function askDevice(q,ctx){
  if(!ENG){banner('Load the on-device model first.');return}
  B.chat.push({role:'u',text:q});B.q='';B.busy=true;render();
  try{
    const raw=ctx||S.notes.slice(0,5).map(n=>noteTitle(n)+': '+n.body).join('\n\n');
    const notes=pickContext(q,raw,2500);
    const msgs=[
      {role:'system',content:'You are StudyBuddy, a friendly tutor. Answer in at most 5 short sentences. If the study notes contain the answer, use them. If not, say the notes do not cover it, then give a brief general answer.'},
      {role:'user',content:(notes?'Study notes:\n'+notes+'\n\n':'')+'Question: '+q}
    ];
    const stream=await ENG.chat.completions.create({messages:msgs,stream:true,max_tokens:350,temperature:0.3});
    let txt='',first=true;
    for await(const ch of stream){
      const d=(ch.choices&&ch.choices[0]&&ch.choices[0].delta&&ch.choices[0].delta.content)||'';
      if(!d)continue;
      txt+=d;
      if(first){first=false;B.chat.push({role:'a',text:txt});B.busy=false;render()}
      else{B.chat[B.chat.length-1].text=txt;const el=$('#chatbox');if(el&&el.lastElementChild){el.lastElementChild.textContent=txt;el.scrollTop=el.scrollHeight}}
    }
    if(first)B.chat.push({role:'a',text:'No response generated.'});
  }catch(e){
    B.chat.push({role:'a',text:'On-device AI error: '+devErr(e)+'\n\nInstant offline answer:\n\n'+offlineSmartAnswer(q,ctx)});
  }
  B.busy=false;render();
}
async function testOnline(){
  const say=m=>{AITEST=m;const el=$('#aitestmsg');if(el)el.textContent=m};
  say('Checking the AI server...');
  const t0=Date.now();
  try{
    const a=new AbortController(),ta=setTimeout(()=>a.abort(),10000);
    await aiFetch(AI_WORKER_URL,{signal:a.signal});clearTimeout(ta);

let F={src:'',text:'',file:null,fileName:'',cards:[],sum:[],name:'',msg:'',loading:false};

function loadPdfJs(){return new Promise((ok,no)=>{if(window.pdfjsLib)return ok();const el=document.createElement('script');el.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';el.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';ok()};el.onerror=()=>no(new Error('net'));document.head.appendChild(el)})}
async function pdfText(f){await loadPdfJs();const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let t='';for(let i=1;i<=Math.min(pdf.numPages,40);i++){const c=await(await pdf.getPage(i)).getTextContent();t+=c.items.map(x=>x.str).join(' ')+'\n'}return t}
function loadMammoth(){return new Promise((ok,no)=>{if(window.mammoth)return ok();const el=document.createElement('script');el.src='https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';el.onload=()=>ok();el.onerror=()=>no(new Error('net'));document.head.appendChild(el)})}
async function docxText(f){await loadMammoth();const r=await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()});return r.value||''}
async function fileText(f){
  if(f.size>MAX_AI_BYTES)throw new Error('size');
  const n=(f.name||'').toLowerCase();
  if(n.endsWith('.pdf'))return pdfText(f);
  if(n.endsWith('.docx'))return docxText(f);
  if(/\.(txt|md|csv|json|html)$/.test(n)||(f.type||'').startsWith('text/'))return f.text();
  try{
    const txt=await f.text();
    const clean=txt.replace(/[^\x20-\x7E\n\r\t]/g,' ').replace(/\s+/g,' ').trim();
    if(clean.length>60)return clean;
  }catch(e){}
  throw new Error('type');
}
function buildCards(t){
  const cards=makeCards(t),seen=new Set(cards.map(c=>c.q.toLowerCase()));
  splitSents(t.replace(/\s+/g,' ')).forEach(x=>{const m=x.match(/^([A-Z][\w\s'()-]{2,50}?)\s+(is|are|refers to|means)\s+(.{15,})$/);if(m&&!seen.has(m[1].toLowerCase())){seen.add(m[1].toLowerCase());cards.push({q:'What '+(m[2]==='are'?'are ':'is ')+m[1]+'?',a:m[3]})}});
  const f={};(t.toLowerCase().match(/[a-z]{4,}/g)||[]).forEach(w=>f[w]=(f[w]||0)+1);
  summarize(t,14).filter(x=>x.length<=220).forEach(x=>{const ws=(x.match(/[A-Za-z]{5,}/g)||[]).sort((a,b)=>(f[b.toLowerCase()]||0)-(f[a.toLowerCase()]||0)||b.length-a.length);if(!ws.length)return;const w=ws[0],q='Fill in the blank: '+x.replace(new RegExp('\\b'+w+'\\b','i'),'_____');if(!seen.has(q)){seen.add(q);cards.push({q,a:w})}});
  const pool=[...new Set(cards.map(c=>c.a))];
  if(pool.length>=4){
    cards.forEach(c=>{
      const al=c.a.toLowerCase(),len=c.a.length;
      const others=pool.filter(a=>a.toLowerCase()!==al).map(a=>({a,k:Math.abs(a.length-len)+Math.random()*25})).sort((x,y)=>x.k-y.k).slice(0,3).map(o=>o.a);
      if(others.length===3)c.choices=[c.a,...others].sort(()=>Math.random()-.5);
    });
  }
  return cards.slice(0,30);
}

function captureFlashInputs(){
  if($('#fsrc'))F.src=$('#fsrc').value;
  if($('#ftext'))F.text=$('#ftext').value;
  const fEl=$('#ffile');
  if(fEl&&fEl.files&&fEl.files[0]){
    F.file=fEl.files[0];
    F.fileName=F.file.name;
  }
}

async function readFlashSource(){
  let t='';
  if(F.file){
    if(F.file.size>MAX_AI_BYTES)throw new Error('size');
    t=await fileText(F.file);
    F.name=F.file.name.replace(/\.[^.]+$/,'');
  }else if(F.text.trim()){
    if(new Blob([F.text]).size>MAX_AI_BYTES)throw new Error('size');
    t=F.text;
    F.name='Pasted text';
  }else if(F.src.startsWith('n:')){
    const n=S.notes.find(x=>x.id===F.src.slice(2));
    t=n?n.body:'';
    F.name=n?noteTitle(n):'';
  }else if(F.src.startsWith('r:')){
    const r=S.res.find(x=>x.id===F.src.slice(2));
    if(r&&r.size>MAX_AI_BYTES)throw new Error('size');
    const b=r&&await fget(r.id);
    if(b){
      if(b.size>MAX_AI_BYTES)throw new Error('size');
      t=await fileText(new File([b],r.name,{type:b.type}));
      F.name=r.name.replace(/\.[^.]+$/,'');
    }
  }
  return t;
}

    }
  }catch(e){
    F.msg=e.message==='size'?'File exceeds the 10 MB maximum limit.':e.message==='net'?'Reading a PDF/DOCX needs an internet connection the first time.':'Could not read that file format. Please use a .pdf, .docx, or .txt file, or paste the text directly.';
  }
  F.loading=false;render();
}

function parseAIJson(raw){
  if(!raw)throw new Error('Empty response from AI');
  let clean=String(raw).trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'').trim();
  const first=clean.indexOf('{'),last=clean.lastIndexOf('}');
  if(first!==-1&&last>first)clean=clean.slice(first,last+1);
  return JSON.parse(clean);
}

async function fmakeAI(){
  if(aiLeft()<=0){
    banner('Daily AI limit reached (2/2 used today). Use Offline mode below!');
    return;
  }
  captureFlashInputs();
  F.loading=true;F.msg='AI is reading, summarizing, and writing multiple-choice flashcards...';F.cards=[];F.sum=[];render();
  try{
    const t=await readFlashSource();
    if(t.trim().length<30){
      F.loading=false;F.msg='Not enough text found. Select a file, pick a note, or paste text first.';render();return;
    }
    const promptText=t.slice(0,20000);
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(),70000);
    const res=await aiFetch(AI_WORKER_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:promptText,device:DEVID}),
      signal:ctrl.signal
    });
    clearTimeout(tid);
    if(!res.ok){
      const errData=await res.json().catch(()=>({}));
      throw new Error((errData.error&&errData.error.message)||('Server Error '+res.status));
    }
    const data=await res.json();
    const parts=(data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts)||[];
    const textPart=parts.find(p=>p.text&&!p.thought)||parts[0];
    const raw=textPart&&textPart.text;
    const parsed=parseAIJson(raw);
    F.sum=Array.isArray(parsed.summary)?parsed.summary:[];
    F.cards=(Array.isArray(parsed.cards)?parsed.cards:[]).map(c=>{
      let ch=Array.isArray(c.choices)?c.choices.slice(0,4):[];
      if(!ch.includes(c.a))ch[0]=c.a;
      ch.sort(()=>Math.random()-.5);
      return {q:c.q,a:c.a,choices:ch};
    });
    S.ai.used=(S.ai.used||0)+1;
    S.ai.date=todayStr();
    save();
    F.msg='AI generated '+F.cards.length+' multiple-choice cards & summary! ('+aiLeft()+'/2 AI uses left today)';
  }catch(e){
    if(e.message==='size')F.msg='File exceeds the 10 MB maximum limit.';
    else if(e.message==='net')F.msg='Internet connection required to read PDF/DOCX or reach AI.';
    else{
      try{
        const t=await readFlashSource();
        if(t.trim().length>=30){
          F.cards=buildCards(t);
          F.sum=summarize(t,5);
        }
      }catch(err){}
      F.msg='Cloud AI notice ('+(e.name==='AbortError'?'Request timed out':e.message)+'). Built offline summary & cards instead so you can keep studying! (No AI credit used)';
    }
  }
  F.loading=false;
  render();
}

const fmtNum=n=>Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});

function eval12(expr){
  const clean=String(expr||'').replace(/[^0-9.+\-*/()% ]/g,'').replace(/%/g,'*0.01');
  if(!clean.trim())return'0';
  try{
    const val=Function('"use strict";return ('+clean+')')();
    if(!isFinite(val))return'Error';
    return Number(Math.round(Number(val+'e6'))+'e-6').toLocaleString('en-PH',{maximumFractionDigits:4});
  }catch(e){return'Error'}
}

function tAccSummaryText(){
  return ACCT.taccounts.map(t=>{
    const drC=sumCents(t.rows,'dr');
    const crC=sumCents(t.rows,'cr');
    const balC=drC-crC;
    return `${t.name}: Total DR ₱${fmtNum(fromCents(drC))}, Total CR ₱${fmtNum(fromCents(crC))} -> Ending ${balC>=0?'Debit':'Credit'} Bal: ₱${fmtNum(fromCents(Math.abs(balC)))}`;
  }).join('\n');
}

async function askAcctBuddy(){
  const qEl=$('#acctq'),attEl=$('#acctatt');
  if(qEl)ACCT.q=qEl.value;
  if(attEl)ACCT.attempt=attEl.value;
  const q=ACCT.q.trim(),att=ACCT.attempt.trim();
  if((!q&&!att)||ACCT.busy)return;
  if(acctLeft()<=0){banner('Daily Accounting AI limit reached ('+MAX_ACCT_DAILY+'/'+MAX_ACCT_DAILY+').');return;}

  const userDisplay=(att?'[My Trial Entry / Computation]: '+att+'\n':'')+q;
  ACCT.chat.push({role:'u',text:userDisplay.trim()});
  ACCT.q='';ACCT.attempt='';ACCT.busy=true;saveAcct();render();

  try{
    const hist=ACCT.chat.slice(-7,-1).map(m=>({role:m.role==='u'?'user':'model',text:m.text.slice(0,600)}));
    const fullCtx=(ACCT.ctx?ACCT.ctx.slice(0,28000)+'\n\n':'')+'[Student Current T-Account Scratchpad]:\n'+tAccSummaryText();
    const ctrl=new AbortController(),tid=setTimeout(()=>ctrl.abort(),50000);
    const res=await aiFetch(AI_WORKER_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({mode:'acct',question:q,attempt:att,context:fullCtx,history:hist,device:DEVID}),
      signal:ctrl.signal
    });
    clearTimeout(tid);
    if(!res.ok){
      const err=await res.json().catch(()=>({}));
      throw new Error((err.error&&err.error.message)||('Server error '+res.status));
    }
    const data=await res.json();
    const parts=(data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts)||[];
    const tp=parts.find(p=>p.text&&!p.thought)||parts[0];
    const reply=(tp&&tp.text)||'Check your ledger dates and try stating your debit/credit reasoning.';
    S.ai.acctUsed=(S.ai.acctUsed||0)+1;save();
    ACCT.chat.push({role:'a',text:reply});
  }catch(e){
    ACCT.chat.push({role:'a',text:'Could not reach the Accounting AI ('+e.message+'). Double-check your T-Account totals in the Scratchpad tab and try again.'});
  }
  ACCT.busy=false;saveAcct();render();
}

let AC;
function audio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function beep(){audio();if(!AC)return;[0,.35,.7].forEach(o=>{const os=AC.createOscillator(),g=AC.createGain();os.frequency.value=880;g.gain.value=.25;os.connect(g);g.connect(AC.destination);os.start(AC.currentTime+o);os.stop(AC.currentTime+o+.2)})}
function banner(msg){let b=$('#bn');if(!b){b=document.createElement('div');b.id='bn';b.className='banner';b.setAttribute('role','alert');b.onclick=()=>b.remove();document.body.appendChild(b)}b.textContent=msg+' (tap to dismiss)'}
function alertNow(title,body){beep();try{navigator.vibrate&&navigator.vibrate([200,100,200,100,200])}catch(e){}banner(title+': '+body);
if(window.Notification&&Notification.permission==='granted'&&navigator.serviceWorker){navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,icon:'icons/icon-192.png',tag:title+body})).catch(()=>{})}}
function check(){
if(!S.alerts)return;
const now=Date.now(),lead=S.lead*60000;
Object.keys(S.fired).forEach(k=>{if(now-S.fired[k]>7*864e5)delete S.fired[k]});
const fire=(key,when,title,body)=>{if(S.fired[key])return;if(now>=when-lead&&now<=when+5*60000){S.fired[key]=now;save();alertNow(title,body)}};
S.tasks.forEach(t=>{if(!t.done&&t.due)fire('t'+t.id,at(t),'Assignment due',t.title+' at '+fmtT(t.time||'23:59'))});
S.exams.forEach(x=>fire('e'+x.id,new Date(x.date+'T'+(x.time||'08:00')).getTime(),'Exam today',x.title+' at '+fmtT(x.time||'08:00')));
const d=new Date().getDay();
S.subjects.forEach(s=>s.classes.forEach(c=>{if(c.day===d)fire('c'+c.id+todayStr(),new Date(todayStr()+'T'+c.start).getTime(),'Class starting',s.name+' at '+fmtT(c.start)+(c.room?' · '+c.room:''))}));
}

ACCT.hist=[];ACCT.justEq=false;
try{var sh=JSON.parse(localStorage.getItem('studyspace-calc')||'[]');if(Array.isArray(sh))ACCT.hist=sh.filter(function(h){return h&&typeof h.e==='string'&&typeof h.t==='string'}).slice(0,8)}catch(e){}
function calcSave(){try{localStorage.setItem('studyspace-calc',JSON.stringify(ACCT.hist.slice(0,8)))}catch(e){}}
var KEYS=[['C','clr','fn'],['(','(','fn'],[')',')','fn'],['÷','/','op'],['7','7',''],['8','8',''],['9','9',''],['×','*','op'],['4','4',''],['5','5',''],['6','6',''],['−','-','op'],['1','1',''],['2','2',''],['3','3',''],['+','+','op'],['0','0',''],['.','.',''],['%','%','fn'],['=','=','eq']];
function pretty(x){return String(x||'').replace(/\*/g,'×').replace(/\//g,'÷').replace(/-/g,'−')}
function calcEval(expr){
  var c=String(expr||'').replace(/%/g,'*0.01').replace(/[^0-9.+\-*\/() ]/g,'');
  if(!c.trim())return null;
  try{
    var v=Function('"use strict";return ('+c+')')();
    if(typeof v!=='number'||!isFinite(v))return null;
    var r=Number(v.toPrecision(12));
    return {raw:r,txt:r.toLocaleString('en-PH',{maximumFractionDigits:6})};
  }catch(e){return null}
}
function show(pop){
  var e=document.getElementById('cexp'),r=document.getElementById('cres');if(!e||!r)return;
  var v=calcEval(ACCT.calcExpr);
  e.textContent=pretty(ACCT.calcExpr)||'Type or tap numbers';
  r.textContent=v?v.txt:(ACCT.calcExpr?'…':'0');
  if(pop){r.classList.remove('pop');void r.offsetWidth;r.classList.add('pop')}
}
function histHTML(){
  return ACCT.hist.length?ACCT.hist.map(function(h,i){return '<button class="chrow" data-chist="'+i+'"><span>'+esc(pretty(h.e))+'</span><b>'+esc(h.t)+'</b></button>'}).join(''):'<div class="empty" style="font-size:13px">Your last calculations show up here.</div>';
}
function calcKey(k){
  var x=ACCT.calcExpr||'';
  if(k==='clr'){x='';ACCT.justEq=false}
  else if(k==='del'){x=x.slice(0,-1);ACCT.justEq=false}
  else if(k==='='){
    var v=calcEval(x);if(!v){show();return}
    ACCT.hist.unshift({e:x,t:v.txt,r:v.raw});ACCT.hist=ACCT.hist.slice(0,8);calcSave();
    ACCT.calcExpr=/e/i.test(String(v.raw))?'':String(v.raw);ACCT.justEq=true;
    var h=document.getElementById('chist');if(h)h.innerHTML=histHTML();
    show(true);return;
  }else{
    if(ACCT.justEq&&/[0-9.(]/.test(k))x='';
    ACCT.justEq=false;if(x.length<70)x+=k;
  }
  ACCT.calcExpr=x;show();
}
function calcView(){
  var v=calcEval(ACCT.calcExpr);
  return '<div class="calc"><div class="cdisp"><div class="cexp" id="cexp">'+(esc(pretty(ACCT.calcExpr))||'Type or tap numbers')+'</div><div class="cres" id="cres">'+(v?esc(v.txt):(ACCT.calcExpr?'…':'0'))+'</div></div>'+
  '<div class="ckeys">'+KEYS.map(function(k){return '<button class="'+k[2]+'" data-ck="'+k[1]+'" aria-label="'+k[0]+'">'+k[0]+'</button>'}).join('')+'</div>'+
  '<div class="two" style="margin-top:10px"><button class="ghost" data-ck="del">⌫ Delete</button><button class="ghost" data-cact="copy">Copy result</button></div></div>'+
  '<div class="lbl">History</div><div class="card" id="chist" style="padding:4px 14px">'+histHTML()+'</div>'+
  '<p class="sub" style="margin-top:8px">Tap a past result to reuse it. Accurate up to 12 digits. Keyboard works too.</p>';
}
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;var d=b.dataset;
  if(d.ck!==undefined){calcKey(d.ck)}
  else if(d.cact==='copy'){
    var v=calcEval(ACCT.calcExpr);if(!v){banner('Nothing to copy yet.');return}
    try{navigator.clipboard.writeText(String(v.raw)).then(function(){banner('Copied '+v.txt)})}catch(x){banner('Could not copy.')}
  }else if(d.chist!==undefined){
    var h=ACCT.hist[+d.chist];
    if(h){ACCT.calcExpr=/e/i.test(String(h.r))?'':String(h.r);ACCT.justEq=true;show(true)}
  }
});
document.addEventListener('keydown',function(e){
  if(!(tab==='acad'&&hv==='acct'&&ACCT.tab==='calc'))return;
  var el=e.target;if(el&&/INPUT|TEXTAREA|SELECT/.test(el.tagName))return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  var k=e.key;
  if(/^[0-9.()+\-*\/%]$/.test(k)){e.preventDefault();calcKey(k)}
  else if(k==='Enter'||k==='='){e.preventDefault();calcKey('=')}
  else if(k==='Backspace'){e.preventDefault();calcKey('del')}
  else if(k==='Escape'||k==='Delete'){calcKey('clr')}
});

/* ---------- ON-DEVICE AI: download fix ---------- */
var URLS=['https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.79/+esm','https://esm.run/@mlc-ai/web-llm@0.2.79','https://esm.sh/@mlc-ai/web-llm@0.2.79'];
wlib=async function(){
  if(WL)return WL;
  var last=null;
  for(var i=0;i<URLS.length;i++){
    try{WL=await import(URLS[i]);return WL}catch(e){last=e}
  }
  throw new Error('ENGINE_LOAD: '+((last&&last.message)||'could not load the AI engine'));
};
devErr=function(e){
  var m=String((e&&e.message)||e||''),s=m.slice(0,110);
  if(/^ENGINE_LOAD/.test(m))return 'Could not load the AI engine from the internet ('+s.slice(13)+'). Try another network, or turn off ad/content blockers, then tap Download again.';
  if(/memory|OOM|device was lost|out of/i.test(m))return 'The phone ran out of memory. Close other apps or pick a smaller model. ('+s+')';
  if(/quota|storage|indexeddb|cache/i.test(m))return 'Not enough storage on this phone, or the browser blocked saving the model. Free some space or pick the Tiny model. ('+s+')';
  return 'Download problem: '+s+'. Already downloaded parts are kept, so tap Download again to continue.';
};
devLoad=async function(){
  if(DEV.state==='loading'||DEV.state==='ready')return;
  if(!navigator.gpu){DEV.state='error';DEV.msg='This browser has no WebGPU, so on-device AI cannot run here. Use Instant or Online mode.';render();return}
  DEV.state='loading';DEV.pct=0;DEV.msg='Starting...';render();
  try{
    var w=await wlib();
    var id=await pickModelId(S.ai.dev||'small');
    DEV.id=id;
    var lastE=null;
    for(var a=1;a<=3&&!ENG;a++){
      try{
        ENG=await w.CreateMLCEngine(id,{initProgressCallback:function(p){DEV.pct=Math.round((p.progress||0)*100);DEV.msg=(a>1?'Retry '+a+'/3. ':'')+(p.text||'');updDev()}});
      }catch(e){
        lastE=e;ENG=null;
        if(/memory|OOM|device was lost|webgpu|f16|workgroup/i.test(String(e&&e.message)))break;
        DEV.msg='Connection hiccup, retrying ('+a+'/3)...';updDev();
        await new Promise(function(r){setTimeout(r,1500*a)});
      }
    }
    if(!ENG)throw lastE||new Error('The model did not start.');
    DEV.state='ready';S.ai.devCached=S.ai.dev||'small';save();
  }catch(e){ENG=null;DEV.state='error';DEV.msg=devErr(e);try{console.error(e)}catch(x){}}
  render();
};

render();

};
async function fcGen(){

function shrink(f){return new Promise(function(ok,no){var u=URL.createObjectURL(f),im=new Image();

async function askAssign(){

  }catch(e){ch.push({role:'a',x:1,text:'Could not get an answer ('+(e.name==='AbortError'?'timed out':e.message)+'). That did not count toward your limit. Try again.'})}

function tone(f,t0,d,type,vol){
  var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;
  o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.25,t+.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05);
}
var BEEPS={
  classic:['Classic beeps',function(){[0,.35,.7].forEach(function(o){tone(880,o,.2)})}],
  chime:['Chime',function(){[523,659,784,1047].forEach(function(f,i){tone(f,i*.16,.5,'sine',.22)})}],
  bell:['Bell',function(){tone(1200,0,1.2,'sine',.25);tone(2400,0,.8,'sine',.08);tone(1200,.9,1.2,'sine',.2)}],
  digital:['Digital',function(){for(var i=0;i<4;i++)tone(1500,i*.14,.08,'square',.12)}],
  soft:['Soft',function(){tone(440,0,.5,'sine',.2);tone(554,.4,.7,'sine',.18)}],
  urgent:['Urgent',function(){for(var i=0;i<6;i++)tone(i%2?740:990,i*.14,.12,'sawtooth',.14)}]
};
