name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, root ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare web folder
        run: |
          mkdir -p www
          cp index.html www/
          cp -r css js icons www/ 2>/dev/null || true

      - name: Install dependencies and add Android platform
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Install icon dependencies
        run: python3 -m pip install --quiet "pillow>=10,<12"

      - name: Apply custom launcher icons
        run: bash scripts/apply-android-icons.sh android

      - name: Apply app icon themes
        run: bash scripts/apply-android-icon-themes.sh android

      - name: Add exam countdown home screen widget
        run: bash scripts/apply-android-widget.sh android

      - name: Add microphone permissions for Group Study
        run: bash scripts/apply-android-media.sh android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudySpace-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
